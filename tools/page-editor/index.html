<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面编辑器 — kikkua</title>
    <link rel="stylesheet" href="../shared/base.css?v=2">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="layout">
        <div class="list-view" id="pageListView">
            <div class="flex-between mb-md">
                <span class="section-title">页面列表</span>
                <button class="btn btn-secondary btn-sm" data-action="pull-remote" title="丢弃本地更改，从 GitHub 重新拉取">⟳ 拉取</button>
                <button class="btn btn-secondary btn-sm" data-action="add-page">+ 新建</button>
            </div>
            <div class="list-panel" id="pageListPanel">
                <div class="edit-panel empty">加载中…</div>
            </div>
        </div>
        <div class="detail-view" id="pageDetailView">
            <div class="flex-row mb-md">
                <button class="btn btn-secondary btn-sm mob-back" data-action="show-page-list">← 返回</button>
                <span class="section-title">编辑页面</span>
            </div>
            <div class="edit-panel empty" id="pageEditPanel">
                <span>选择一个页面开始编辑</span>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module" src="main.js?v=2"></script>
</body>
</html>
