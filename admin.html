<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kikkua · 管理</title>
<link rel="stylesheet" href="admin/style.css">
</head>
<body>

<!-- Connection Modal -->
<div class="connect-overlay" id="connectOverlay">
    <div class="connect-dialog">
        <h2>kikkua<span>·</span> 管理</h2>
        <p>后台配置面板</p>
        <div class="connect-form">
            <input type="password" id="connectTokenInput" placeholder="GitHub Token (ghp_xxx)" class="connect-input">
            <button class="btn btn-primary connect-btn" id="connectSubmitBtn">连接</button>
        </div>
        <div class="connect-status" id="connectStatus">请输入 Token 连接</div>
        <div class="connect-hint"><a href="https://github.com/settings/tokens" target="_blank" rel="noopener">生成 Token →</a></div>
        <!-- Loading progress -->
        <div class="connect-loading hidden" id="connectLoading">
            <div class="loading-bar">
                <div class="loading-progress" id="loadingProgress"></div>
            </div>
            <div class="loading-text" id="loadingText">加载中…</div>
            <div class="loading-steps">
                <div class="loading-step" id="stepDecks">⏳ 牌组</div>
                <div class="loading-step" id="stepTemplates">⏳ 模板</div>
                <div class="loading-step" id="stepTags">⏳ 标签</div>
                <div class="loading-step" id="stepDashboard">⏳ 仪表盘</div>
            </div>
        </div>
    </div>
</div>

<!-- Sidebar overlay (mobile) -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <h1>kikkua<span>·</span> 管理</h1>
        <p>后台配置面板</p>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-item active" data-section="dashboard">📊 仪表盘</div>
        <div class="nav-item" data-section="decks">📋 牌组</div>
        <div class="nav-item" data-section="templates">🎨 模板</div>
        <div class="nav-item" data-section="tags">🏷 标签</div>
        <div class="nav-item" data-section="pages">📄 页面</div>
        <div class="nav-item" data-section="media">🖼 媒体</div>
    </nav>
    <div class="sidebar-footer">
        <div class="status" id="statusBadge">✅ 已连接</div>
        <button class="btn btn-secondary btn-sm" id="disconnectBtn">断开连接</button>
        <div class="stat" id="footerStats"></div>
    </div>
</aside>

<!-- Main -->
<div class="main hidden" id="mainContent">
    <div class="page-header">
        <button class="hamburger" id="menuBtn">☰</button>
        <h2 id="pageTitle">📊 仪表盘</h2>
        <div class="flex-row">
            <!-- save buttons removed — now iframe plugins -->
        </div>
    </div>
    <div class="page-content">

        <!-- Dashboard -->
        <div class="page-section active" id="secDashboard">
            <div class="stat-grid">
                <div class="stat-card"><div class="num" id="statDecks">-</div><div class="label">牌组</div></div>
                <div class="stat-card"><div class="num" id="statTemplates">-</div><div class="label">模板</div></div>
                <div class="stat-card"><div class="num" id="statCards">-</div><div class="label">卡片总数</div></div>
                <div class="stat-card"><div class="num" id="statData">-</div><div class="label">数据文件</div></div>
            </div>
            <div id="dashboardActions" class="flex-wrap">
                <button class="btn btn-primary btn-sm" data-dashboard-action="decks">📋 管理牌组</button>
                <button class="btn btn-secondary btn-sm" data-dashboard-action="templates">🎨 管理模板</button>
                <a href="https://kikkua.goatcounter.com" target="_blank" rel="noopener" class="btn btn-secondary btn-sm no-underline">📈 访问统计</a>
            </div>
        </div>

        <!-- Decks (iframe plugin) -->
        <div class="page-section" id="secDecks">
            <div id="deckManagerPluginContainer" style="width:100%;height:100%;"></div>
        </div>

        <!-- Tags (iframe plugin) -->
        <div class="page-section" id="secTags">
            <div id="tagEditorPluginContainer" style="width:100%;height:100%;"></div>
        </div>

        <!-- Pages (iframe plugin) -->
        <div class="page-section" id="secPages">
            <div id="pageEditorPluginContainer" style="width:100%;height:100%;"></div>
        </div>

        <!-- Media (iframe plugin) -->
        <div class="page-section" id="secMedia">
            <div id="mediaBrowserPluginContainer" style="width:100%;height:100%;"></div>
        </div>

        <!-- Templates (iframe plugin) -->
        <div class="page-section" id="secTemplates">
            <div id="templateEditorPluginContainer" style="width:100%;height:100%;"></div>
        </div>

    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script type="module" src="admin/main.js?v=3"></script>
</body>
</html>
