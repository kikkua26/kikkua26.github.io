<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kikkua · 管理后台</title>
<style>
:root {
    --bg: #f6f1ea; --surface: #fcf9f5; --border: #e4dbcf;
    --text: #1a1512; --text2: #6b5e52; --text3: #95877a;
    --accent: #c5532c; --accent-hover: #a84628; --accent-bg: rgba(197,83,44,.08);
    --radius: 8px; --green: #6b8f72;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    padding-bottom: 80px;
}
.container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

/* ── Header ── */
.page-header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 0; position: sticky; top: 0; z-index: 100;
}
.page-header .container { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.page-header h1 { font-size: 20px; font-weight: 600; }
.page-header h1 span { color: var(--accent); }
.page-header .btn { flex-shrink: 0; }

.token-input {
    flex: 1; min-width: 150px; max-width: 340px;
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; background: var(--bg);
}
.token-input:focus { outline: none; border-color: var(--accent); }

/* ── Buttons ── */
.btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 7px 16px; border-radius: 6px; border: none; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: .2s;
}
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-secondary { background: var(--border); color: var(--text); }
.btn-secondary:hover:not(:disabled) { background: #d5cabc; }
.btn-danger { background: #c0392b; color: #fff; }
.btn-danger:hover:not(:disabled) { background: #a93226; }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-xs { padding: 3px 10px; font-size: 11px; }

/* ── Tabs ── */
.tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin: 20px 0; }
.tab {
    padding: 10px 24px; font-size: 14px; font-weight: 500; color: var(--text3);
    cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px;
    transition: .2s; user-select: none;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-color: var(--accent); }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* ── Deck Tab ── */
.deck-layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; min-height: 400px; }
.deck-list-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    overflow-y: auto; max-height: 600px;
}
.deck-list-item {
    padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
    transition: background .15s; position: relative;
}
.deck-list-item:hover { background: var(--bg); }
.deck-list-item.active {
    background: var(--accent-bg); border-left: 3px solid var(--accent);
}
.deck-list-item .name { font-weight: 600; font-size: 14px; }
.deck-list-item .meta { font-size: 12px; color: var(--text3); margin-top: 2px; display: flex; gap: 12px; }
.deck-list-item .badge {
    font-size: 11px; background: var(--bg); padding: 1px 6px; border-radius: 8px; color: var(--text2);
}

.deck-edit-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px; max-height: 600px; overflow-y: auto;
}
.deck-edit-panel.empty { display: flex; align-items: center; justify-content: center; color: var(--text3); font-size: 14px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 3px; }
.field input, .field textarea, .field select {
    width: 100%; padding: 7px 10px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 14px; font-family: inherit; background: var(--bg);
}
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); }
.field textarea { min-height: 50px; resize: vertical; font-size: 13px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.edit-actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }

/* ── Template Tab ── */
.tpl-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px;
}
.tpl-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; cursor: pointer; transition: .2s;
}
.tpl-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,.06); transform: translateY(-2px); }
.tpl-card .tpl-icon { font-size: 32px; margin-bottom: 8px; }
.tpl-card .tpl-name { font-weight: 600; font-size: 14px; }
.tpl-card .tpl-meta { font-size: 12px; color: var(--text3); margin-top: 2px; }
.tpl-card.selected { border-color: var(--accent); background: var(--accent-bg); }
.tpl-card.add-card {
    border-style: dashed; display: flex; flex-direction: column;
    align-items: center; justify-content: center; min-height: 120px;
    color: var(--text3); cursor: pointer; transition: .2s;
}
.tpl-card.add-card:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-bg); }
.tpl-card.add-card .big { font-size: 28px; margin-bottom: 4px; }

.tpl-editor { margin-top: 20px; display: none; }
.tpl-editor.show { display: block; }
.tpl-editor .editor-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
}
.tpl-editor .editor-header h3 { font-size: 15px; font-weight: 600; }
.tpl-file-tabs { display: flex; gap: 0; margin-bottom: 10px; }
.tpl-file-tab {
    padding: 6px 16px; font-size: 13px; cursor: pointer; border: 1px solid var(--border);
    background: var(--bg); transition: .15s;
}
.tpl-file-tab:first-child { border-radius: 6px 0 0 6px; }
.tpl-file-tab:last-child { border-radius: 0 6px 6px 0; }
.tpl-file-tab.active { background: var(--surface); border-bottom-color: var(--surface); font-weight: 600; }
.tpl-editor textarea {
    width: 100%; min-height: 280px; padding: 14px; border: 1px solid var(--border);
    border-radius: var(--radius); font-family: 'Menlo','Consolas',monospace; font-size: 13px;
    background: var(--surface); resize: vertical;
}

/* ── CSV Tab ── */
.csv-list { display: grid; gap: 10px; }
.csv-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 18px; display: flex; justify-content: space-between; align-items: center;
}
.csv-item .name { font-weight: 500; font-size: 14px; }
.csv-table-wrap { overflow-x: auto; margin-top: 14px; display: none; }
.csv-table-wrap.show { display: block; }
.csv-table-wrap table {
    width: 100%; border-collapse: collapse; font-size: 12px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
}
.csv-table-wrap th, .csv-table-wrap td {
    padding: 5px 10px; border: 1px solid var(--border); text-align: left;
    max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.csv-table-wrap th { background: var(--bg); font-weight: 600; }

/* ── Modal ── */
.modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4);
    z-index: 1000; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
    background: var(--surface); border-radius: var(--radius); padding: 28px;
    max-width: 440px; width: 90%; box-shadow: 0 8px 40px rgba(0,0,0,.15);
}
.modal h3 { font-size: 18px; margin-bottom: 8px; }
.modal p { color: var(--text2); font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
.modal .field { margin-bottom: 14px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

/* ── Toast ── */
.toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    padding: 12px 24px; border-radius: var(--radius); font-size: 14px; font-weight: 500;
    z-index: 2000; opacity: 0; transition: opacity .3s; pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,.12); white-space: nowrap;
}
.toast.show { opacity: 1; }
.toast.success { background: #ebf5ed; color: #2d6a4f; border: 1px solid #a3d9b1; }
.toast.error { background: #fef0ef; color: var(--accent); border: 1px solid #f5c6cb; }

/* ── Bottom bar ── */
.bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 10px 20px; display: none; gap: 10px; align-items: center; z-index: 500;
}
.bottom-bar .msg { flex: 1; font-size: 13px; }
.bottom-bar .msg.success { color: var(--green); }
.bottom-bar .msg.error { color: var(--accent); }

/* ── Misc ── */
.empty-state { text-align: center; padding: 50px 20px; color: var(--text3); }
.empty-state p { font-size: 14px; margin-top: 4px; }
.stat-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; color: var(--text2); background: var(--bg);
    padding: 4px 10px; border-radius: 12px;
}
</style>
</head>
<body>

<!-- Header -->
<div class="page-header">
    <div class="container">
        <h1>kikkua<span>·</span> 管理</h1>
        <input class="token-input" id="tokenInput" type="password" placeholder="GitHub Token（ghp_xxx）" autocomplete="off">
        <button class="btn btn-primary btn-sm" id="connectBtn">连接</button>
        <span id="statusBadge" class="stat-badge">⚪ 未连接</span>
        <a href="https://github.com/settings/tokens/new?description=kikkua+admin&scopes=repo" target="_blank" rel="noopener" style="font-size:12px;color:var(--accent);">生成 Token →</a>
    </div>
</div>

<div class="container">

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active" data-tab="decks">📋 牌组</div>
        <div class="tab" data-tab="templates">🎨 模板</div>
    </div>

    <!-- ──────── Tab: Decks ──────── -->
    <div class="tab-content active" id="tabDecks">
        <div class="deck-layout">
            <div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                    <span style="font-size:13px;font-weight:600;color:var(--text2);">牌组列表</span>
                    <button class="btn btn-secondary btn-xs" id="addDeckBtn">+ 新建</button>
                </div>
                <div class="deck-list-panel" id="deckListPanel">
                    <div class="empty-state" style="padding:30px;"><p>加载中…</p></div>
                </div>
            </div>
            <div class="deck-edit-panel empty" id="deckEditPanel">
                <span>选择一个牌组开始编辑</span>
            </div>
        </div>
    </div>

    <!-- ──────── Tab: Templates ──────── -->
    <div class="tab-content" id="tabTemplates">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <span style="font-size:13px;font-weight:600;color:var(--text2);">模板包</span>
            <button class="btn btn-secondary btn-sm" id="newTplBtn">+ 新建模板</button>
        </div>
        <div class="tpl-grid" id="tplGrid"><div class="empty-state"><p>加载中…</p></div></div>
        <div class="tpl-editor" id="tplEditor">
            <div class="editor-header">
                <h3 id="tplEditorTitle"></h3>
                <button class="btn btn-primary btn-sm" id="tplSaveBtn">保存文件</button>
            </div>
            <div class="tpl-file-tabs" id="tplFileTabs"></div>
            <textarea id="tplEditorContent" spellcheck="false"></textarea>
            <div style="font-size:12px;color:var(--text3);margin-top:6px;" id="tplSaveStatus"></div>
        </div>
    </div>


</div>

<!-- Bottom Bar -->
<div class="bottom-bar" id="bottomBar">
    <div class="msg" id="bottomMsg"></div>
    <button class="btn btn-secondary btn-sm" id="saveBtn">保存牌组</button>
    <button class="btn btn-primary" id="deployBtn">保存并部署</button>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalBody">
        <h3 id="modalTitle">确认</h3>
        <p id="modalText">确定执行此操作？</p>
        <div class="modal-actions">
            <button class="btn btn-secondary" id="modalCancel">取消</button>
            <button class="btn btn-danger" id="modalConfirm">确认</button>
        </div>
    </div>
</div>

<!-- CSV file input & preview modal -->
<input type="file" id="csvFileInput" accept=".csv" style="display:none;">
<div class="modal-overlay" id="csvPreviewOverlay">
    <div class="modal" style="max-width:90vw;max-height:80vh;overflow-y:auto;padding:20px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <h3 id="csvPreviewTitle" style="font-size:16px;font-weight:600;"></h3>
            <button class="btn btn-secondary btn-sm" onclick="document.getElementById('csvPreviewOverlay').classList.remove('show')">关闭</button>
        </div>
        <div style="overflow-x:auto;font-size:12px;">
            <table style="width:100%;border-collapse:collapse;"><thead id="csvPreviewHead"></thead><tbody id="csvPreviewBody"></tbody></table>
        </div>
        <div style="margin-top:8px;font-size:12px;color:var(--text3);" id="csvPreviewInfo"></div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const GH = 'https://api.github.com';
const PRIV = 'kikkua/kikkua_ankideck';
const PUB = 'kikkua/kikkua.github.io';

let token = '', decks = [], dataSha = '', tplNames = [];
let currentDeckIdx = -1;
let tplFiles = {}; // { 'path': { sha, content } }
let currentTpl = '', currentTplFile = '';

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => (''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function gh(url, opts = {}) {
    const res = await fetch(url.startsWith('http') ? url : GH + url, {
        ...opts,
        headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json', ...opts.headers }
    });
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.message || `HTTP ${res.status}`); }
    return res.json();
}

function b64enc(s) { return btoa(unescape(encodeURIComponent(s))); }
function b64dec(s) {
    const r = atob(s.replace(/\s/g,'')); return new TextDecoder('utf-8').decode(Uint8Array.from(r,c=>c.charCodeAt(0)));
}

async function readRepo(repo, path) { const r = await gh(`/repos/${repo}/contents/${path}`); return { sha: r.sha, text: b64dec(r.content) }; }
async function writeRepo(repo, path, content, sha, msg) {
    return gh(`/repos/${repo}/contents/${path}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg || 'Update from admin', content: b64enc(content), sha })
    });
}
async function listRepo(repo, path) { return gh(`/repos/${repo}/contents/${path}`); }

// ─── Toast ───
let tt;
function toast(text, type='success') {
    const el = $('#toast'); el.textContent = text; el.className = `toast ${type} show`;
    clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 3000);
}

// ─── Modal ───
function confirmModal(title, text) {
    return new Promise(r => {
        $('#modalTitle').textContent = title; $('#modalText').textContent = text;
        $('#modalOverlay').classList.add('show');
        $('#modalConfirm').onclick = () => { $('#modalOverlay').classList.remove('show'); r(true); };
        $('#modalCancel').onclick = () => { $('#modalOverlay').classList.remove('show'); r(false); };
    });
}

function inputModal(title, label, placeholder = '') {
    return new Promise(r => {
        $('#modalTitle').textContent = title;
        $('#modalBody').querySelectorAll('.field').forEach(e => e.remove());
        const div = document.createElement('div'); div.className = 'field';
        div.innerHTML = `<label>${label}</label><input id="modalInput" placeholder="${placeholder}">`;
        $('#modalText').after(div);
        $('#modalOverlay').classList.add('show');
        $('#modalConfirm').textContent = '确定';
        $('#modalConfirm').onclick = () => { const v = $('#modalInput').value.trim(); $('#modalOverlay').classList.remove('show'); r(v); };
        $('#modalCancel').onclick = () => { $('#modalOverlay').classList.remove('show'); r(null); };
        setTimeout(() => $('#modalInput').focus(), 100);
    });
}

function setBadge(text, cls = '') {
    const el = $('#statusBadge'); el.textContent = text; el.className = 'stat-badge' + (cls ? ' ' + cls : '');
}
function setBottom(msg, cls = '') {
    const el = $('#bottomMsg'); el.textContent = msg; el.className = 'msg' + (cls ? ' ' + cls : '');
}

async function loadData() {
    setBadge('⏳ 加载数据…');
    try {
        const user = await gh('/user');
        if (!user.login) throw new Error('Token 无效');
        await Promise.all([loadDecks(), loadTemplates()]);
        setBadge(`✅ ${user.login} · 📋 ${decks.length} 牌组 · 🎨 ${tplNames.length} 模板`, 'success');
        $('#connectBtn').textContent = '✅ 已连接';
        $('#connectBtn').disabled = true;
        $('#tokenInput').disabled = true;
        setBottom('就绪');
    } catch (e) {
        setBadge('❌ ' + e.message, 'error');
    }
}

// ═══════════════════════════════════════
//  DECKS
// ═══════════════════════════════════════

async function loadDecks() {
    try {
        const r = await readRepo(PRIV, 'index.json');
        dataSha = r.sha; decks = JSON.parse(r.text);
        renderDeckList();
        setBadge(`📋 ${decks.length} 牌组 · 🎨 ${tplNames.length} 模板`);
        $('#bottomBar').style.display = 'flex';
        setBottom('就绪');
    } catch (e) { setBadge('❌ ' + e.message, 'error'); }
}

function renderDeckList() {
    const el = $('#deckListPanel');
    if (!decks.length) { el.innerHTML = '<div class="empty-state" style="padding:30px"><p>暂无牌组</p></div>'; return; }
    el.innerHTML = decks.map((d, i) => `
        <div class="deck-list-item${i === currentDeckIdx ? ' active' : ''}" onclick="selectDeck(${i})">
            <div class="name">${esc(d.name)}</div>
            <div class="meta">
                <span>📄 ${d.totalCards||0}</span>
                <span class="badge">${esc(d.template||'?')}</span>
                ${(d.tags||[])[0] ? `<span class="badge">${esc(d.tags[0].split('::').pop())}</span>` : ''}
            </div>
        </div>
    `).join('');
}

function selectDeck(i) {
    currentDeckIdx = i; renderDeckList();
    const d = decks[i];
    const tplOptions = tplNames.map(n => `<option value="${esc(n)}"${n===d.template?' selected':''}>${esc(n)}</option>`).join('');
    const tagStr = (d.tags||[]).join(', ');

    $('#deckEditPanel').className = 'deck-edit-panel';
    $('#deckEditPanel').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <h3 style="font-size:16px;font-weight:600;">${esc(d.name)}</h3>
        </div>
        <div class="field-row">
            <div class="field"><label>显示名称</label><input value="${esc(d.name)}" onchange="upd(${i},'name',this.value);renderDeckList();" id="f_name"></div>
            <div class="field"><label>模板 ID</label><select onchange="upd(${i},'template',this.value)">${tplOptions}</select></div>
        </div>
        <div class="field-row">
            <div class="field"><label>卡片数量</label><input type="number" value="${d.totalCards||0}" onchange="upd(${i},'totalCards',parseInt(this.value)||0)"></div>
            <div class="field"><label>章节字段名</label><input value="${esc(d.chapterField||'章节')}" onchange="upd(${i},'chapterField',this.value)"></div>
        </div>
        <div class="field"><label>标签（逗号分隔，:: 表示层级）</label><input value="${esc(tagStr)}" onchange="upd(${i},'tags',this.value.split(/,\s*/).filter(Boolean))"></div>
        <div class="field"><label>购买链接</label><input value="${esc(d.purchaseUrl||'')}" onchange="upd(${i},'purchaseUrl',this.value)"></div>
        <div class="field"><label>牌组介绍（Markdown）</label><textarea rows="4" onchange="upd(${i},'detail',this.value)">${esc(d.detail||'')}</textarea></div>

        <div style="border-top:1px solid var(--border);padding-top:14px;margin-top:14px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <span style="font-size:13px;font-weight:600;color:var(--text2);">📊 数据文件</span>
                <div style="display:flex;gap:6px;">
                    <button class="btn btn-secondary btn-xs" onclick="previewCsv('${esc(d.name)}')">查看</button>
                    <button class="btn btn-secondary btn-xs" onclick="downloadCsv('${esc(d.name)}')">下载</button>
                    <button class="btn btn-secondary btn-xs" onclick="uploadCsv('${esc(d.name)}')">上传替换</button>
                </div>
            </div>
            <div id="csvPreviewDeck" style="font-size:12px;color:var(--text3);">${d.totalCards > 0 ? `${d.totalCards} 条记录` : '暂无数据，点击上传添加 CSV'}</div>
        </div>

        <div class="edit-actions">
            <button class="btn btn-primary btn-sm" onclick="saveDecks()">保存</button>
            <button class="btn btn-danger btn-sm" onclick="delDeck(${i})">删除此牌组</button>
        </div>
    `;
    $('#bottomBar').style.display = 'flex'; setBottom('编辑中');
}

function upd(i, k, v) { decks[i][k] = v; setBottom('有未保存的修改'); }

async function saveDecks() {
    setBottom('保存中…');
    try {
        const json = JSON.stringify(decks, null, 2);
        await writeRepo(PRIV, 'index.json', json, dataSha, 'Update decks from admin');
        const r = await readRepo(PRIV, 'index.json'); dataSha = r.sha;
        setBottom('✅ 已保存', 'success'); toast('牌组已保存');
    } catch (e) { setBottom('❌ ' + e.message, 'error'); toast(e.message, 'error'); }
}

async function delDeck(i) {
    const ok = await confirmModal('删除牌组', `确认删除"${decks[i].name}"？所有关联数据不会被删除。`);
    if (!ok) return;
    const name = decks[i].name; decks.splice(i, 1);
    currentDeckIdx = -1; await saveDecks();
    renderDeckList();
    $('#deckEditPanel').className = 'deck-edit-panel empty';
    $('#deckEditPanel').innerHTML = '<span>选择一个牌组开始编辑</span>';
    toast(`已删除"${name}"`);
}

// ═══════════════════════════════════════
//  TEMPLATES
// ═══════════════════════════════════════

async function loadTemplates() {
    try {
        const items = await listRepo(PUB, 'templates');
        tplNames = items.filter(i => i.type === 'dir').map(i => i.name);
        renderTplGrid();
    } catch (e) {
        $('#tplGrid').innerHTML = `<div class="empty-state"><p>加载失败：${e.message}</p></div>`;
    }
}

function renderTplGrid() {
    const el = $('#tplGrid');
    el.innerHTML = tplNames.map(n => `
        <div class="tpl-card${n===currentTpl?' selected':''}" onclick="selectTpl('${esc(n)}')">
            <div class="tpl-icon">📁</div>
            <div class="tpl-name">${esc(n)}</div>
            <div class="tpl-meta">正面模板.html · 背面模板.html · 样式.css</div>
        </div>
    `).join('') + `
        <div class="tpl-card add-card" onclick="createTpl()">
            <div class="big">+</div>
            <span>新建模板</span>
        </div>
    `;
}

async function selectTpl(name) {
    currentTpl = name; renderTplGrid();
    const editor = $('#tplEditor'); editor.classList.add('show');
    $('#tplEditorTitle').textContent = name;
    $('.editor-header .btn').textContent = '保存文件';
    // Render file tabs
    const files = ['正面模板.html', '背面模板.html', '样式.css'];
    $('#tplFileTabs').innerHTML = files.map((f, i) =>
        `<span class="tpl-file-tab${i===0?' active':''}" onclick="switchTplFile('${esc(name)}','${esc(f)}',this)">${f}</span>`
    ).join('');
    // Load first file
    switchTplFile(name, files[0], $('#tplFileTabs').firstChild);
}
window.selectTpl = selectTpl;

async function switchTplFile(tpl, file, tab) {
    currentTplFile = `templates/${tpl}/${file}`;
    $$('.tpl-file-tab').forEach(t => t.classList.remove('active'));
    if (tab) tab.classList.add('active');
    $('#tplEditorContent').value = '加载中…';
    $('#tplSaveStatus').textContent = '';
    try {
        const r = await readRepo(PUB, currentTplFile);
        tplFiles[currentTplFile] = { sha: r.sha };
        $('#tplEditorContent').value = r.text;
    } catch (e) {
        if (e.message.includes('Not Found')) {
            $('#tplEditorContent').value = `/* 文件不存在，创建后保存 */\n`;
            tplFiles[currentTplFile] = { sha: null };
        } else {
            $('#tplEditorContent').value = `/* 加载失败：${e.message} */`;
        }
    }
}
window.switchTplFile = switchTplFile;

$('#tplSaveBtn').addEventListener('click', async () => {
    const content = $('#tplEditorContent').value;
    const info = tplFiles[currentTplFile] || { sha: null };
    try {
        await writeRepo(PUB, currentTplFile, content, info.sha, 'Update ' + currentTplFile);
        const r = await readRepo(PUB, currentTplFile);
        tplFiles[currentTplFile] = { sha: r.sha };
        $('#tplSaveStatus').textContent = '✅ 已保存';
        toast('模板文件已保存');
    } catch (e) { $('#tplSaveStatus').textContent = '❌ ' + e.message; toast(e.message, 'error'); }
});

async function createTpl() {
    const name = await inputModal('新建模板', '模板名称（将作为目录名和模板 ID）', '例如: my-template');
    if (!name) return;
    if (tplNames.includes(name)) { toast('模板已存在', 'error'); return; }
    // Create 3 files
    try {
        await writeRepo(PUB, `templates/${name}/正面模板.html`, '{{Front}}', null, 'Create template');
        await writeRepo(PUB, `templates/${name}/背面模板.html`, '{{FrontSide}}\n\n<hr>\n\n{{Back}}', null, 'Create template');
        await writeRepo(PUB, `templates/${name}/样式.css`, '.card { font-family: arial; font-size: 20px; }', null, 'Create template');
        tplNames.push(name);
        renderTplGrid();
        selectTpl(name);
        toast(`模板"${name}"已创建`);
    } catch (e) { toast('创建失败：' + e.message, 'error'); }
}
window.createTpl = createTpl;

// ═══════════════════════════════════════
//  CSV
// ═══════════════════════════════════════

let csvMeta = {};

function parseCsvRow(l) {
    const r = []; let c = '', q = false;
    for (let i = 0; i < l.length; i++) {
        const ch = l[i];
        if (ch === '"') { q ? (l[i+1]=='"'?(c+='"',i++):q=false) : q=true; }
        else if (ch === ',' && !q) { r.push(c); c = ''; }
        else c += ch;
    }
    r.push(c); return r;
}

async function previewCsv(deck) {
    try {
        const r = await readRepo(PRIV, deck + '/data.csv');
        csvMeta[deck] = { sha: r.sha, text: r.text };
        const lines = r.text.trim().split('\n');
        const rows = lines.map(parseCsvRow);
        $('#csvPreviewTitle').textContent = deck + '/data.csv';
        $('#csvPreviewInfo').textContent = `共 ${rows.length-1} 条记录`;
        $('#csvPreviewHead').innerHTML = `<tr>${rows[0].map(h=>`<th style="padding:4px 10px;border:1px solid var(--border);background:var(--bg);white-space:nowrap;">${esc(h)}</th>`).join('')}</tr>`;
        $('#csvPreviewBody').innerHTML = rows.slice(1, 101).map(r => `<tr>${r.map(c=>`<td style="padding:3px 8px;border:1px solid var(--border);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(c.slice(0,80))}</td>`).join('')}</tr>`).join('');
        if (rows.length > 101) {
            $('#csvPreviewBody').innerHTML += `<tr><td colspan="${rows[0].length}" style="text-align:center;padding:8px;color:var(--text3);">… 仅显示前 100 行</td></tr>`;
        }
        $('#csvPreviewOverlay').classList.add('show');
        // Update deck edit panel
        const info = $('#csvPreviewDeck');
        if (info) info.textContent = `${rows.length - 1} 条记录`;
    } catch (e) {
        toast('加载失败：' + e.message, 'error');
    }
}
window.previewCsv = previewCsv;

async function downloadCsv(deck) {
    try {
        const r = csvMeta[deck] || await readRepo(PRIV, deck + '/data.csv');
        csvMeta[deck] = { sha: r.sha, text: r.text };
        const blob = new Blob([r.text], { type: 'text/csv;charset=utf-8' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = deck + '_data.csv'; a.click();
    } catch (e) {
        toast('下载失败：' + e.message, 'error');
    }
}
window.downloadCsv = downloadCsv;

async function uploadCsv(deck) {
    const input = $('#csvFileInput');
    input.onchange = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        const text = await file.text();
        const ok = await confirmModal('替换 CSV', `确认替换 ${deck}/data.csv？`);
        if (!ok) { input.value = ''; return; }
        try {
            const sha = csvMeta[deck] ? csvMeta[deck].sha : null;
            const r = await writeRepo(PRIV, deck + '/data.csv', text, sha, 'Update ' + deck + '/data.csv');
            csvMeta[deck] = { sha: r.content.sha, text };
            previewCsv(deck);
            toast('CSV 已更新');
        } catch (err) { toast('保存失败：' + err.message, 'error'); }
    };
    input.click();
}
window.uploadCsv = uploadCsv;

// ═══════════════════════════════════════
//  CONNECT
// ═══════════════════════════════════════

async function connect() {
    token = $('#tokenInput').value.trim();
    if (!token) { setBadge('⚠️ 请输入 Token', 'error'); return; }
    sessionStorage.setItem('admin_token', token);
    setBadge('⏳ 连接中…');
    try {
        await gh('/user');
        setBadge('⏳ 加载数据…');
        await Promise.all([loadDecks(), loadTemplates()]);
        setBadge(`✅ 已连接 · 📋 ${decks.length} 牌组 · 🎨 ${tplNames.length} 模板`, 'success');
        $('#connectBtn').textContent = '已连接';
        $('#connectBtn').disabled = true;
        $('#tokenInput').disabled = true;
        setBottom('就绪，点击牌组开始编辑');
    } catch (e) {
        setBadge('❌ 连接失败: ' + e.message, 'error');
    }
}

// ─── Init ───
$('#connectBtn').addEventListener('click', connect);
$('#tokenInput').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });

const savedToken = sessionStorage.getItem('admin_token');
if (savedToken) { $('#tokenInput').value = savedToken; connect(); }

// Tab switching
$$('.tab').forEach(t => {
    t.addEventListener('click', () => {
        $$('.tab').forEach(x => x.classList.remove('active'));
        $$('.tab-content').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        const id = 'tab' + t.dataset.tab.charAt(0).toUpperCase() + t.dataset.tab.slice(1);
        $(`#${id}`).classList.add('active');
    });
});

$('#addDeckBtn').addEventListener('click', async () => {
    const name = await inputModal('新建牌组', '牌组名称', '例如: 新牌组');
    if (!name) return;
    if (decks.find(d => d.name === name)) { toast('牌组已存在', 'error'); return; }
    decks.push({ name, totalCards: 0, tags: [], template: tplNames[0] || 'kikkua高级模板', chapterField: '章节', detail: '', purchaseUrl: '' });
    renderDeckList();
    selectDeck(decks.length - 1);
    toast('已添加"' + name + '"，点击保存提交');
});

// Save & Deploy
$('#saveBtn').addEventListener('click', saveDecks);
$('#deployBtn').addEventListener('click', async () => {
    const ok = await confirmModal('保存并部署', '将保存牌组配置到 GitHub，并触发网站重新部署。\n部署约 1 分钟后生效。');
    if (!ok) return;
    await saveDecks();
    setBottom('触发部署中…');
    try {
        await gh(`/repos/${PUB}/dispatches`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ event_type: 'deploy' })
        });
        setBottom('✅ 已保存并部署，约 1 分钟后生效', 'success');
        toast('保存并部署成功');
    } catch (e) { setBottom('❌ 部署失败：' + e.message, 'error'); toast(e.message, 'error'); }
});
</script>
