<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kikkua · 管理</title>
<style>
:root {
    --sidebar: 240px;
    --bg: #f6f1ea; --surface: #fcf9f5; --border: #e4dbcf;
    --text: #1a1512; --text2: #6b5e52; --text3: #95877a;
    --accent: #c5532c; --accent-hover: #a84628; --accent-bg: rgba(197,83,44,.08);
    --radius: 8px; --green: #6b8f72;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    display: flex; min-height: 100vh;
}
/* ── Sidebar ── */
.sidebar {
    width: var(--sidebar); flex-shrink: 0;
    background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
    transition: transform .3s var(--ease-out, ease);
}
.sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
.sidebar-header h1 { font-size: 18px; font-weight: 600; }
.sidebar-header h1 span { color: var(--accent); }
.sidebar-header p { font-size: 12px; color: var(--text3); margin-top: 2px; }
.sidebar-nav { flex: 1; padding: 12px 0; }
.nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 20px; font-size: 14px; color: var(--text2); cursor: pointer;
    transition: .15s; border-left: 3px solid transparent;
}
.nav-item:hover { background: var(--bg); color: var(--text); }
.nav-item.active { color: var(--accent); background: var(--accent-bg); border-left-color: var(--accent); font-weight: 500; }
.sidebar-footer {
    padding: 16px 20px; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 8px;
}
.sidebar-footer .stat { font-size: 12px; color: var(--text3); }
.sidebar-footer .token-row { display: flex; gap: 6px; }
.sidebar-footer input {
    flex: 1; padding: 5px 8px; border: 1px solid var(--border); border-radius: 4px;
    font-size: 12px; background: var(--bg); min-width: 0;
}
.sidebar-footer .status { font-size: 12px; color: var(--text3); }
.sidebar-footer .status.ok { color: var(--green); }
.sidebar-footer .status.err { color: var(--accent); }

/* ── Main ── */
.main { flex: 1; margin-left: var(--sidebar); display: flex; flex-direction: column; height: 100vh; height: 100dvh; min-width: 0; }
.page-header {
    padding: 20px 28px; border-bottom: 1px solid var(--border);
    background: var(--surface); display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
}
.page-header h2 { font-size: 18px; font-weight: 600; flex: 1; }
.hamburger { display: none; font-size: 22px; cursor: pointer; background: none; border: none; padding: 4px; }
.page-content { flex: 1; overflow-y: auto; padding: 24px 28px; }
.page-section { display: none; }
.page-section.active { display: block; }

/* ── Dashboard ── */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 28px; }
.stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; text-align: center;
}
.stat-card .num { font-size: 28px; font-weight: 600; color: var(--accent); }
.stat-card .label { font-size: 13px; color: var(--text3); margin-top: 4px; }

/* ── Buttons ── */
.btn {
    display: inline-flex; align-items: center; gap: 4px; padding: 7px 14px;
    border-radius: 6px; border: none; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: .2s;
}
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-secondary { background: var(--border); color: var(--text); }
.btn-secondary:hover:not(:disabled) { background: #d5cabc; }
.btn-danger { background: #c0392b; color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-xs { padding: 2px 8px; font-size: 11px; }

/* ── Decks ── */
.deck-layout { display: grid; grid-template-columns: 280px 1fr; gap: 20px; min-height: 400px; }
.deck-list-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    overflow-y: auto; max-height: 600px;
}
.deck-list-item {
    padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
    transition: background .15s; border-left: 3px solid transparent;
}
.deck-list-item:hover { background: var(--bg); }
.deck-list-item.active { background: var(--accent-bg); border-left-color: var(--accent); }
.deck-list-item .name { font-weight: 600; font-size: 14px; }
.deck-list-item .meta { font-size: 12px; color: var(--text3); margin-top: 2px; display: flex; gap: 10px; }
.deck-edit-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px; max-height: 600px; overflow-y: auto;
}
.deck-edit-panel.empty { display: flex; align-items: center; justify-content: center; color: var(--text3); }

/* ── Fields ── */
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 11px; font-weight: 600; color: var(--text2); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .03em; }
.field input, .field textarea, .field select {
    width: 100%; padding: 7px 10px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 14px; font-family: inherit; background: var(--bg);
}
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); }
.field textarea { min-height: 50px; resize: vertical; font-size: 13px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.edit-actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }

/* ── Templates ── */
.tpl-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px;
}
.tpl-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; cursor: pointer; transition: .2s;
}
.tpl-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,.06); transform: translateY(-2px); }
.tpl-card .icon { font-size: 28px; margin-bottom: 6px; }
.tpl-card .name { font-weight: 600; font-size: 14px; }
.tpl-card .meta { font-size: 12px; color: var(--text3); margin-top: 2px; }
.tpl-card.selected { border-color: var(--accent); background: var(--accent-bg); }
.tpl-card.add {
    border-style: dashed; display: flex; flex-direction: column;
    align-items: center; justify-content: center; min-height: 100px; color: var(--text3); cursor: pointer;
}
.tpl-card.add:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-bg); }
.tpl-card.add .big { font-size: 24px; }
.tpl-editor { margin-top: 20px; max-width: 800px; }
.tpl-editor .file-tabs { display: flex; gap: 0; margin-bottom: 10px; }
.tpl-editor .file-tab {
    padding: 6px 16px; font-size: 13px; cursor: pointer; border: 1px solid var(--border);
    background: var(--bg); transition: .15s;
}
.tpl-editor .file-tab:first-child { border-radius: 6px 0 0 6px; }
.tpl-editor .file-tab:last-child { border-radius: 0 6px 6px 0; }
.tpl-editor .file-tab.active { background: var(--surface); border-bottom-color: var(--surface); font-weight: 600; }
.tpl-editor textarea {
    width: 100%; min-height: 250px; padding: 14px; border: 1px solid var(--border);
    border-radius: var(--radius); font-family: 'Menlo','Consolas',monospace; font-size: 13px;
    background: var(--surface); resize: vertical;
}

/* ── Toast ── */
.toast {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    padding: 10px 24px; border-radius: var(--radius); font-size: 14px; font-weight: 500;
    z-index: 2000; opacity: 0; transition: opacity .3s; pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,.12);
}
.toast.show { opacity: 1; }
.toast.success { background: #ebf5ed; color: #2d6a4f; border: 1px solid #a3d9b1; }
.toast.error { background: #fef0ef; color: var(--accent); border: 1px solid #f5c6cb; }

/* ── Modal ── */
.modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4);
    z-index: 1000; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
    background: var(--surface); border-radius: var(--radius); padding: 28px;
    max-width: 440px; width: 90%; box-shadow: 0 8px 40px rgba(0,0,0,.15);
}
.modal h3 { font-size: 18px; margin-bottom: 8px; }
.modal p { color: var(--text2); font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
.modal .field input { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: var(--bg); }

/* ── CSV preview ── */
.csv-table { font-size: 12px; width: 100%; border-collapse: collapse; margin-top: 12px; }
.csv-table th, .csv-table td { padding: 4px 8px; border: 1px solid var(--border); text-align: left; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.csv-table th { background: var(--bg); font-weight: 600; position: sticky; top: 0; z-index: 1; }

/* ── Overlay (mobile) ── */
.sidebar-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 99;
}

.mob-back { display: none; }

/* ── Responsive ── */
@media (max-width: 767px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay.show { display: block; }
    .main { margin-left: 0; }
    .page-header { padding: 14px 16px; }
    .page-content { padding: 16px; }
    .hamburger { display: inline-flex; align-items: center; }
    .deck-layout { grid-template-columns: 1fr; }
    .deck-list-panel { max-height: 250px; }
    .stat-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .tpl-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .deck-list-view, .deck-detail-view { display: none !important; }
    .deck-list-view.mob-show, .deck-detail-view.mob-show { display: block !important; }
    .mob-back { display: inline-flex; }
}
</style>
</head>
<body>

<!-- Sidebar overlay (mobile) -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <h1>kikkua<span>·</span> 管理</h1>
        <p>后台配置面板</p>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-item active" data-section="dashboard">📊 仪表盘</div>
        <div class="nav-item" data-section="decks">📋 牌组</div>
        <div class="nav-item" data-section="templates">🎨 模板</div>
    </nav>
    <div class="sidebar-footer">
        <div class="token-row">
            <input type="password" id="tokenInput" placeholder="Token (ghp_xxx)">
            <button class="btn btn-primary btn-sm" id="connectBtn">连接</button>
            <button class="btn btn-secondary btn-sm" id="disconnectBtn" style="display:none;">✕</button>
        </div>
        <div class="status" id="statusBadge">⚪ 未连接</div>
        <div style="font-size:11px;margin-top:2px;"><a href="https://github.com/settings/tokens" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;">生成 Token →</a></div>
        <div class="stat" id="footerStats"></div>
    </div>
</aside>

<!-- Main -->
<div class="main">
    <div class="page-header">
        <button class="hamburger" id="menuBtn">☰</button>
        <h2 id="pageTitle">📊 仪表盘</h2>
        <div style="display:flex;gap:8px;">
            <button class="btn btn-secondary btn-sm" id="saveBtn">💾 保存</button>
        </div>
    </div>
    <div class="page-content">

        <!-- Dashboard -->
        <div class="page-section active" id="secDashboard">
            <div class="stat-grid">
                <div class="stat-card"><div class="num" id="statDecks">-</div><div class="label">牌组</div></div>
                <div class="stat-card"><div class="num" id="statTemplates">-</div><div class="label">模板</div></div>
                <div class="stat-card"><div class="num" id="statCards">-</div><div class="label">卡片总数</div></div>
                <div class="stat-card"><div class="num" id="statData">-</div><div class="label">数据文件</div></div>
            </div>
            <div id="dashboardActions" style="display:flex;gap:10px;flex-wrap:wrap;">
                <button class="btn btn-primary btn-sm" onclick="switchSection('decks')">📋 管理牌组</button>
                <button class="btn btn-secondary btn-sm" onclick="switchSection('templates')">🎨 管理模板</button>
                <a href="https://kikkua.goatcounter.com" target="_blank" rel="noopener" class="btn btn-secondary btn-sm" style="text-decoration:none;">📈 访问统计</a>
            </div>
        </div>

        <!-- Decks -->
        <div class="page-section" id="secDecks">
            <div class="deck-layout">
                <div class="deck-list-view" id="deckListView">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
                        <span style="font-size:13px;font-weight:600;color:var(--text2);">牌组列表</span>
                        <button class="btn btn-secondary btn-sm" id="addDeckBtn">+ 新建</button>
                    </div>
                    <div class="deck-list-panel" id="deckListPanel"><div class="deck-edit-panel empty">加载中…</div></div>
                </div>
                <div class="deck-detail-view" id="deckDetailView">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
                    <button class="btn btn-secondary btn-sm mob-back" onclick="showDeckList()">← 返回</button>
                    <span style="font-size:13px;font-weight:600;color:var(--text2);">编辑牌组</span>
                </div>
                <div class="deck-edit-panel" id="deckEditPanel"></div>
            </div>
            </div>
        </div>

        <!-- Templates -->
        <div class="page-section" id="secTemplates">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
                <span style="font-size:13px;font-weight:600;color:var(--text2);">模板包</span>
                <button class="btn btn-secondary btn-sm" id="newTplBtn">+ 新建</button>
            </div>
            <div class="tpl-grid" id="tplGrid"><div class="tpl-card add" style="grid-column:1/-1;">加载中…</div></div>
            <div class="tpl-editor" id="tplEditor" style="display:none;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                    <h3 id="tplEditorTitle" style="font-size:15px;font-weight:600;"></h3>
                    <button class="btn btn-primary btn-sm" id="tplSaveBtn">保存文件</button>
                </div>
                <div class="file-tabs" id="tplFileTabs"></div>
                <textarea id="tplEditorContent" spellcheck="false"></textarea>
            </div>
        </div>

    </div>
</div>

<!-- CSV preview modal -->
<div class="modal-overlay" id="csvPreviewOverlay">
    <div class="modal" style="max-width:90vw;max-height:80vh;overflow-y:auto;padding:20px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <h3 id="csvPreviewTitle" style="font-size:16px;font-weight:600;"></h3>
            <button class="btn btn-secondary btn-sm" onclick="$('#csvPreviewOverlay').classList.remove('show')">关闭</button>
        </div>
        <div style="overflow-x:auto;overflow-y:auto;max-height:50vh;"><table class="csv-table" id="csvTable"><tbody></tbody></table></div>
        <div style="margin-top:8px;font-size:12px;color:var(--text3);" id="csvPreviewInfo"></div>
    </div>
</div>
<input type="file" id="csvFileInput" accept=".csv" style="display:none;">

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalBody">
        <h3 id="modalTitle">确认</h3>
        <p id="modalText">确定执行此操作？</p>
        <div class="modal-actions">
            <button class="btn btn-secondary" id="modalCancel">取消</button>
            <button class="btn btn-danger" id="modalConfirm">确认</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Visitor tracking -->
<script data-goatcounter="https://kikkua.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

<script>
const GH = 'https://api.github.com';
const REPO = 'kikkua26/kikkua26.github.io';

let token = '', decks = [], dataSha = '', tplNames = [];
let currentDeckIdx = -1, currentTpl = '', currentTplFile = '';
let tplFiles = {};

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => (''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function gh(url, opts = {}) {
    const res = await fetch(url.startsWith('http') ? url : GH + url, {
        ...opts,
        headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json', ...opts.headers }
    });
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.message || `HTTP ${res.status}`); }
    return res.json();
}
function b64enc(s) { return btoa(unescape(encodeURIComponent(s))); }
function b64dec(s) { const r = atob(s.replace(/\s/g,'')); return new TextDecoder().decode(Uint8Array.from(r,c=>c.charCodeAt(0))); }
async function readRepo(path) { const r = await gh(`/repos/${REPO}/contents/${path}`); return { sha: r.sha, text: b64dec(r.content) }; }
async function writeRepo(path, content, sha, msg) {
    return gh(`/repos/${REPO}/contents/${path}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg || 'Update from admin', content: b64enc(content), sha })
    });
}
async function listRepo(path) { return gh(`/repos/${REPO}/contents/${path}`); }

// ─── Toast ───
let tt;
function toast(text, type='success') {
    const el = $('#toast'); el.textContent = text; el.className = `toast ${type} show`;
    clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 3000);
}
function confirmModal(title, text) {
    return new Promise(r => {
        $('#modalTitle').textContent = title; $('#modalText').textContent = text;
        $('#modalOverlay').classList.add('show');
        $('#modalConfirm').onclick = () => { $('#modalOverlay').classList.remove('show'); r(true); };
        $('#modalCancel').onclick = () => { $('#modalOverlay').classList.remove('show'); r(false); };
    });
}
function inputModal(title, label, placeholder = '') {
    return new Promise(r => {
        $('#modalTitle').textContent = title;
        document.querySelectorAll('#modalBody .field').forEach(e => e.remove());
        const f = document.createElement('div'); f.className = 'field';
        f.innerHTML = `<input id="modalInput" placeholder="${placeholder}">`;
        $('#modalText').after(f);
        $('#modalOverlay').classList.add('show');
        $('#modalConfirm').textContent = '确定';
        $('#modalConfirm').onclick = () => { const v = $('#modalInput').value.trim(); $('#modalOverlay').classList.remove('show'); r(v); };
        $('#modalCancel').onclick = () => { $('#modalOverlay').classList.remove('show'); r(null); };
        setTimeout(() => $('#modalInput').focus(), 100);
    });
}

function setStatus(text, cls = '') {
    $('#statusBadge').textContent = text;
    $('#statusBadge').className = 'status' + (cls ? ' ' + cls : '');
}
function updateDashboard() {
    const total = decks.reduce((s, d) => s + (d.totalCards || 0), 0);
    $('#statDecks').textContent = decks.length || '-';
    $('#statTemplates').textContent = tplNames.length || '-';
    $('#statCards').textContent = total || '-';
    $('#statData').textContent = decks.filter(d => d.totalCards > 0).length || '-';
}
function switchSection(name) {
    $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.section === name));
    $$('.page-section').forEach(s => s.classList.toggle('active', s.id === 'sec' + name.charAt(0).toUpperCase() + name.slice(1)));
    const titles = { dashboard: '📊 仪表盘', decks: '📋 牌组', templates: '🎨 模板' };
    $('#pageTitle').textContent = titles[name] || name;
    if (window.innerWidth <= 767) closeSidebar();
    if (name === 'decks') { renderDeckList(); if (window.innerWidth <= 767) { document.getElementById('deckListView').classList.add('mob-show'); document.getElementById('deckDetailView').classList.remove('mob-show'); } }
    if (name === 'templates') renderTplGrid();
}
$$('.nav-item').forEach(n => n.addEventListener('click', () => switchSection(n.dataset.section)));

// ─── Sidebar ───
function openSidebar() { $('#sidebar').classList.add('open'); $('#sidebarOverlay').classList.add('show'); }
function closeSidebar() { $('#sidebar').classList.remove('open'); $('#sidebarOverlay').classList.remove('show'); }
$('#menuBtn').addEventListener('click', openSidebar);
$('#sidebarOverlay').addEventListener('click', closeSidebar);

// ─── CONNECT ───
async function connect() {
    token = $('#tokenInput').value.trim();
    if (!token) { setStatus('⚠️ 请输入 Token', 'err'); return; }
    sessionStorage.setItem('admin_token', token);
    setStatus('⏳ 连接中…');
    try {
        const user = await gh('/user');
        await loadDecks();
        await loadTemplates();
        setStatus(`✅ ${user.login}`, 'ok');
        $('#connectBtn').textContent = '已连';
        $('#connectBtn').disabled = true;
        $('#disconnectBtn').style.display = 'inline-flex';
        $('#tokenInput').disabled = true;
        updateDashboard();
        $('#footerStats').textContent = `📋 ${decks.length} 牌组 · 🎨 ${tplNames.length} 模板`;
    } catch (e) { setStatus('❌ ' + e.message, 'err'); }
}
function disconnect() {
    sessionStorage.removeItem('admin_token'); token = '';
    decks = []; tplNames = [];
    $('#tokenInput').value = ''; $('#tokenInput').disabled = false;
    $('#connectBtn').textContent = '连接'; $('#connectBtn').disabled = false;
    $('#disconnectBtn').style.display = 'none';
    setStatus('⚪ 已断开');
    $('#footerStats').textContent = '';
    updateDashboard();
}

// ─── DECKS ───
async function loadDecks() {
    const r = await readRepo('data/index.json');
    dataSha = r.sha; decks = JSON.parse(r.text);
    renderDeckList();
}

function renderDeckList() {
    const el = $('#deckListPanel');
    if (!decks.length) { el.innerHTML = '<div class="deck-edit-panel empty"><span>暂无牌组</span></div>'; return; }
    el.innerHTML = decks.map((d, i) => `
        <div class="deck-list-item${i===currentDeckIdx?' active':''}" onclick="selectDeck(${i})">
            <div class="name">${esc(d.name)}</div>
            <div class="meta"><span>📄 ${d.totalCards||0}</span><span class="badge">${esc(d.template||'?')}</span></div>
            ${d.summary ? `<div style="font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(d.summary)}</div>` : ''}
        </div>
    `).join('');
}

function showDeckList() {
    if (window.innerWidth <= 767) {
        document.getElementById('deckListView').classList.add('mob-show');
        document.getElementById('deckDetailView').classList.remove('mob-show');
    }
    renderDeckList();
    var ep = document.getElementById('deckEditPanel');
    if (ep) { ep.className = 'deck-edit-panel empty'; ep.innerHTML = '<span>选择一个牌组开始编辑</span>'; }
    currentDeckIdx = -1;
}
function selectDeck(i) {
    currentDeckIdx = i; renderDeckList();
    if (window.innerWidth <= 767) {
        document.getElementById('deckListView').classList.remove('mob-show');
        document.getElementById('deckDetailView').classList.add('mob-show');
    }
    const d = decks[i];
    const tplOpts = tplNames.map(n => `<option value="${esc(n)}"${n===d.template?' selected':''}>${esc(n)}</option>`).join('');
    const tagStr = (d.tags||[]).join(', ');

    $('#deckEditPanel').className = 'deck-edit-panel';
    $('#deckEditPanel').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <h3 style="font-size:16px;font-weight:600;">${esc(d.name)}</h3>
        </div>
        <div class="field-row">
            <div class="field"><label>名称</label><input value="${esc(d.name)}" onchange="upd(${i},'name',this.value);renderDeckList();"></div>
            <div class="field"><label>模板</label><select onchange="upd(${i},'template',this.value)">${tplOpts}</select></div>
        </div>
        <div class="field-row">
            <div class="field"><label>卡片数</label><input type="number" value="${d.totalCards||0}" onchange="upd(${i},'totalCards',parseInt(this.value)||0)"></div>
            <div class="field"><label>章节字段</label><input value="${esc(d.chapterField||'章节')}" onchange="upd(${i},'chapterField',this.value)"></div>
        </div>
        <div class="field"><label>标签 (逗号分隔)</label><input value="${esc(tagStr)}" onchange="upd(${i},'tags',this.value.split(/,\s*/).filter(Boolean))"></div>
        <div class="field"><label>简述</label><input value="${esc(d.summary||'')}" onchange="upd(${i},'summary',this.value)" placeholder="卡片列表中显示的简短介绍"></div>
        <div class="field"><label>购买链接</label><input value="${esc(d.purchaseUrl||'')}" onchange="upd(${i},'purchaseUrl',this.value)"></div>
        <div class="field"><label>介绍 (Markdown)</label><textarea rows="3" onchange="upd(${i},'detail',this.value)">${esc(d.detail||'')}</textarea></div>

        <div style="border-top:1px solid var(--border);padding-top:14px;margin-top:14px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <span style="font-size:13px;font-weight:600;color:var(--text2);">📊 数据文件</span>
                <div style="display:flex;gap:6px;">
                    <button class="btn btn-secondary btn-xs" onclick="previewCsv('${esc(d.name)}')">查看</button>
                    <button class="btn btn-secondary btn-xs" onclick="downloadCsv('${esc(d.name)}')">下载</button>
                    <button class="btn btn-secondary btn-xs" onclick="uploadCsv('${esc(d.name)}')">上传</button>
                </div>
            </div>
            <div style="font-size:12px;color:var(--text3);">${d.totalCards > 0 ? `${d.totalCards} 条记录` : '暂无数据'}</div>
        </div>

        <div class="edit-actions">
            <button class="btn btn-primary btn-sm" onclick="saveDecks()">💾 保存</button>
            <button class="btn btn-danger btn-sm" onclick="delDeck(${i})">删除</button>
        </div>
    `;
}
function upd(i, k, v) { decks[i][k] = v; }
async function saveDecks() {
    try {
        const json = JSON.stringify(decks, null, 2);
        await writeRepo('data/index.json', json, dataSha, 'Update decks from admin');
        const r = await readRepo('data/index.json'); dataSha = r.sha;
        updateDashboard();
        toast('已保存');
    } catch (e) { toast(e.message, 'error'); }
}
async function delDeck(i) {
    const ok = await confirmModal('删除', `确认删除"${decks[i].name}"？`);
    if (!ok) return;
    decks.splice(i, 1); currentDeckIdx = -1;
    await saveDecks();
    renderDeckList();
    $('#deckEditPanel').className = 'deck-edit-panel empty';
    $('#deckEditPanel').innerHTML = '<span>选择一个牌组开始编辑</span>';
}

// ─── CSV ───
let csvMeta = {};
function parseCsvRow(l) {
    const r = []; let c = '', q = false;
    for (let i = 0; i < l.length; i++) {
        const ch = l[i];
        if (ch === '"') { q ? (l[i+1]=='"'?(c+='"',i++):q=false) : q=true; }
        else if (ch === ',' && !q) { r.push(c); c = ''; }
        else c += ch;
    }
    r.push(c); return r;
}
async function previewCsv(deck) {
    try {
        const r = await readRepo('data/' + deck + '/data.csv');
        csvMeta[deck] = { sha: r.sha, text: r.text };
        const lines = r.text.trim().split('\n');
        const rows = lines.map(parseCsvRow);
        $('#csvPreviewTitle').textContent = deck + '/data.csv';
        $('#csvPreviewInfo').textContent = `共 ${rows.length-1} 条记录`;
        $('#csvTable').innerHTML = `<tr>${rows[0].map(h=>`<th>${esc(h)}</th>`).join('')}</tr>` +
            rows.slice(1, 101).map(r => `<tr>${r.map(c=>`<td>${esc(c.slice(0,80))}</td>`).join('')}</tr>`).join('');
        $('#csvPreviewOverlay').classList.add('show');
    } catch (e) { toast('加载失败', 'error'); }
}
async function downloadCsv(deck) {
    try {
        const r = csvMeta[deck] || await readRepo('data/' + deck + '/data.csv');
        csvMeta[deck] = { sha: r.sha, text: r.text };
        const blob = new Blob([r.text], { type: 'text/csv;charset=utf-8' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = deck + '_data.csv'; a.click();
    } catch (e) { toast('下载失败', 'error'); }
}
async function uploadCsv(deck) {
    const input = $('#csvFileInput');
    input.onchange = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        const text = await file.text();
        const ok = await confirmModal('替换 CSV', `确认替换 ${deck}/data.csv？`);
        if (!ok) { input.value = ''; return; }
        try {
            const sha = csvMeta[deck] ? csvMeta[deck].sha : null;
            const r = await writeRepo('data/' + deck + '/data.csv', text, sha, 'Update ' + deck);
            csvMeta[deck] = { sha: r.content.sha, text };
            toast('CSV 已更新');
        } catch (err) { toast(err.message, 'error'); }
        input.value = '';
    };
    input.click();
}

// ─── TEMPLATES ───
async function loadTemplates() {
    try {
        const items = await listRepo('templates');
        tplNames = items.filter(i => i.type === 'dir').map(i => i.name);
        renderTplGrid();
    } catch (e) { $('#tplGrid').innerHTML = `<div class="tpl-card add" style="grid-column:1/-1;">加载失败</div>`; }
}
function renderTplGrid() {
    const el = $('#tplGrid');
    el.innerHTML = tplNames.map(n => `
        <div class="tpl-card${n===currentTpl?' selected':''}" onclick="selectTpl('${esc(n)}')">
            <div class="icon">📁</div><div class="name">${esc(n)}</div>
            <div class="meta">模板包</div>
        </div>
    `).join('') + '<div class="tpl-card add" onclick="createTpl()"><div class="big">+</div><span>新建</span></div>';
}
async function selectTpl(name) {
    currentTpl = name; renderTplGrid();
    const editor = $('#tplEditor'); editor.style.display = 'block';
    $('#tplEditorTitle').textContent = name;
    const files = ['正面模板.html', '背面模板.html', '样式.css'];
    $('#tplFileTabs').innerHTML = files.map((f, i) =>
        `<span class="file-tab${i===0?' active':''}" onclick="switchTplFile('${esc(name)}','${esc(f)}',this)">${f}</span>`
    ).join('');
    switchTplFile(name, files[0], $('#tplFileTabs').firstChild);
}
async function switchTplFile(tpl, file, tab) {
    currentTplFile = `templates/${tpl}/${file}`;
    $$('.file-tab').forEach(t => t.classList.remove('active'));
    if (tab) tab.classList.add('active');
    $('#tplEditorContent').value = '加载中…';
    try {
        const r = await readRepo(currentTplFile);
        tplFiles[currentTplFile] = { sha: r.sha };
        $('#tplEditorContent').value = r.text;
    } catch (e) {
        if (e.message.includes('Not Found')) {
            $('#tplEditorContent').value = `/* 新文件 */\n`;
            tplFiles[currentTplFile] = { sha: null };
        } else {
            $('#tplEditorContent').value = `/* 加载失败 */`;
        }
    }
}
$('#tplSaveBtn').addEventListener('click', async () => {
    const info = tplFiles[currentTplFile] || { sha: null };
    try {
        await writeRepo(currentTplFile, $('#tplEditorContent').value, info.sha, 'Update ' + currentTplFile);
        const r = await readRepo(currentTplFile);
        tplFiles[currentTplFile] = { sha: r.sha };
        toast('已保存');
    } catch (e) { toast(e.message, 'error'); }
});
async function createTpl() {
    const name = await inputModal('新建模板', '模板名称', 'my-template');
    if (!name) return;
    if (tplNames.includes(name)) { toast('已存在', 'error'); return; }
    try {
        await writeRepo(`templates/${name}/正面模板.html`, '{{Front}}', null, 'Create');
        await writeRepo(`templates/${name}/背面模板.html`, '{{FrontSide}}\n\n<hr>\n\n{{Back}}', null, 'Create');
        await writeRepo(`templates/${name}/样式.css`, '.card { font-family: arial; font-size: 20px; }', null, 'Create');
        tplNames.push(name); renderTplGrid(); selectTpl(name);
        toast(`"${name}" 已创建`);
    } catch (e) { toast(e.message, 'error'); }
}

// ─── INIT ───
$('#connectBtn').addEventListener('click', connect);
$('#disconnectBtn').addEventListener('click', disconnect);
$('#tokenInput').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
$('#saveBtn').addEventListener('click', saveDecks);
$('#addDeckBtn').addEventListener('click', async () => {
    const name = await inputModal('新建牌组', '牌组名称', '新牌组');
    if (!name) return;
    if (decks.find(d => d.name === name)) { toast('已存在', 'error'); return; }
    decks.push({ name, totalCards: 0, tags: [], template: tplNames[0]||'', chapterField:'章节', detail:'', purchaseUrl:'', summary:'' });
    renderDeckList(); selectDeck(decks.length-1);
    toast('已添加，点击保存提交');
});

const saved = sessionStorage.getItem('admin_token');
if (saved) { $('#tokenInput').value = saved; connect(); }
</script>
</body>
</html>
