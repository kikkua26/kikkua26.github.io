<script>
// ==================== 模板默认配置 ====================
window.ANKI_TEMPLATE_DEFAULTS = {
    revealBlanks: true,
    otherContentMode: 'popup',
    theme: 'system',
    fontSize: 16
};

// ==================== 工具函数 ====================
// 生成设备标识授权号（用于版权保护威慑）
function generateAuthCode() {
    const deviceInfo = [
        navigator.userAgent,
        screen.width,
        screen.height,
        navigator.language,
        new Date().getTime().toString().substring(0, 8)
    ].join('');

    function simpleHash(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            const char = str.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash;
        }
        return Math.abs(hash);
    }

    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    const hashValue = simpleHash(deviceInfo);
    let result = '';

    for (let i = 0; i < 12; i++) {
        const index = (hashValue * (i + 1)) % chars.length;
        result += chars.charAt(index);
    }

    return result.replace(/(.{4})/g, '$1-').slice(0, -1);
}

// ==================== 增强版存储模块 ====================
window.ankiStorage = (function() {
    const prefix = 'anki_sel_';
    const configPrefix = 'anki_cfg_';

    return {
        set: function(key, data) {
            const safeKey = prefix + btoa(encodeURIComponent(key)).slice(0, 50);
            try {
                localStorage.setItem(safeKey, JSON.stringify(data));
            } catch(e) {
                console.warn('localStorage setItem failed, falling back to window object for key:', safeKey, e);
                window[safeKey] = data;
            }
        },
        get: function(key) {
            const safeKey = prefix + btoa(encodeURIComponent(key)).slice(0, 50);
            try {
                const data = localStorage.getItem(safeKey);
                return data ? JSON.parse(data) : null;
            } catch(e) {
                console.warn('localStorage getItem failed, falling back to window object for key:', safeKey, e);
                return window[safeKey] || null;
            }
        },
        clear: function(key) {
            const safeKey = prefix + btoa(encodeURIComponent(key)).slice(0, 50);
            try {
                localStorage.removeItem(safeKey);
            } catch(e) {
                console.warn('localStorage removeItem failed, attempting to delete from window object for key:', safeKey, e);
                delete window[safeKey];
            }
        },
        // Config-specific methods
        setConfig: function(configKey, value) {
            try {
                localStorage.setItem(configPrefix + configKey, JSON.stringify(value));
            } catch (e) {
                console.error('Error saving config to localStorage:', configKey, e);
            }
        },
        getConfig: function(configKey) {
            try {
                const value = localStorage.getItem(configPrefix + configKey);
                return value !== null ? JSON.parse(value) : undefined; // Return undefined if not found
            } catch (e) {
                console.error('Error reading config from localStorage:', configKey, e);
                return undefined;
            }
        }
    };
})();

// 背面模板的JavaScript
(function() {
    // 隐藏空的章节
    function hideEmptyChapter() {
        const chapter = document.getElementById('chapter-display');
        if (chapter) {
            const text = chapter.textContent.trim();
            if (!text) {
                chapter.style.display = 'none';
            }
        }
    }
    
    // 全局变量
    const explanationBox = document.getElementById('explanationBox');
    const explanationTitle = document.getElementById('explanationTitle');
    const explanationContent = document.getElementById('explanationContent');
    const closeExplanation = document.getElementById('closeExplanation');
    
    // 名词解释解析模块
    const ExplanationParserModule = (function() {
        // 解析文本中的名词解释标记
        function parseExplanations(text) {
            const explanations = [];
            let i = 0;
            
            while (i < text.length) {
                // 检查名词解释开始
                if (text.substring(i, i + 2) === '【*') {
                    const endIndex = findMatchingEnd(text, i, '【*', '*】');
                    if (endIndex !== -1) {
                        const innerText = text.substring(i + 2, endIndex);
                        const separatorIndex = innerText.indexOf('::');
                        
                        if (separatorIndex !== -1) {
                            const term = innerText.substring(0, separatorIndex);
                            const explanationText = innerText.substring(separatorIndex + 2);
                            
                            explanations.push({
                                start: i,
                                end: endIndex + 2,
                                term: term,
                                explanation: explanationText
                            });
                            
                            i = endIndex + 2;
                            continue;
                        }
                    }
                }
                i++;
            }
            
            return explanations;
        }
        
        // 找到匹配的结束标记
        function findMatchingEnd(text, startIndex, startMarker, endMarker) {
            let depth = 1;
            let i = startIndex + startMarker.length;
            
            while (i < text.length) {
                if (text.substring(i, i + startMarker.length) === startMarker) {
                    depth++;
                    i += startMarker.length;
                } else if (text.substring(i, i + endMarker.length) === endMarker) {
                    depth--;
                    if (depth === 0) {
                        return i;
                    }
                    i += endMarker.length;
                } else {
                    i++;
                }
            }
            
            return -1; // 没有找到匹配的结束标记
        }
        
        // 创建术语元素
        function createTermElement(term, explanation, setupElementEvents) {
            const termSpan = document.createElement('span');
            termSpan.className = 'term';
            
            // 解析术语中的HTML标签
            const tempElement = document.createElement('span');
            tempElement.innerHTML = term;
            while (tempElement.firstChild) {
                termSpan.appendChild(tempElement.firstChild);
            }
            
            // 添加点击事件 - 显示解释，兼容iOS
            setupElementEvents(termSpan, function(e) {
                // 如果这个名词解释在未揭示的挖空内，则先揭示挖空
                const parentBlank = this.closest('.blank');
                if (parentBlank && !parentBlank.classList.contains('revealed')) {
                    parentBlank.classList.add('revealed');
                    // 恢复嵌套名解的可见性
                    const nestedTerms = parentBlank.querySelectorAll('.term');
                    nestedTerms.forEach(term => {
                        term.style.visibility = 'visible';
                    });
                    // 阻止事件冒泡，防止触发其他事件
                    e.stopPropagation();
                    return;
                }
                
                // 获取术语在卡片中的位置百分比
                const card = document.querySelector('.card');
                const cardRect = card ? card.getBoundingClientRect() : null;
                const termRect = this.getBoundingClientRect();
                let positionYPercent = null;
                if (cardRect && termRect) {
                    // 计算术语中心相对于卡片顶部的百分比
                    const termCenterY = (termRect.top + termRect.bottom) / 2;
                    positionYPercent = ((termCenterY - cardRect.top) / cardRect.height) * 100;
                }
                
                // 显示解释框，传入位置百分比
                ExplanationModule.showExplanation(term, explanation, positionYPercent);
                
                // 阻止事件冒泡，防止触发其他事件
                e.stopPropagation();
            });
            
            return termSpan;
        }
        
        // 公共API
        return {
            parseExplanations: parseExplanations,
            createTermElement: createTermElement
        };
    })();
    
    // 名词解释模块封装
    const ExplanationModule = (function() {
        // 私有变量
        let explanationBox = null;
        let explanationTitle = null;
        let explanationContent = null;
        let closeExplanation = null;
        
        // 初始化模块
        function init(box, title, content, closeBtn) {
            explanationBox = box;
            explanationTitle = title;
            explanationContent = content;
            closeExplanation = closeBtn;
            
            // 设置关闭按钮事件
            setupCloseButton();
            
            // 点击页面其他地方关闭解释框
            setupDocumentClick();
        }
        
        // 显示解释框
        function showExplanation(term, explanation, positionYPercent) {
            if (!explanationBox || !explanationTitle || !explanationContent) {
                console.error('Explanation module not initialized');
                return;
            }
            
            // 设置解释标题
            explanationTitle.innerHTML = term;
            
            // 处理解释内容中的特殊标记
            const hasSpecialMarkers = explanation.includes('[[') || explanation.includes('【*');
            if (hasSpecialMarkers && typeof parseText === 'function') {
                // 使用 parseText 解析挖空
                const parsedNodes = parseText(explanation);
                explanationContent.innerHTML = '';
                // 使用简化版 renderNodes
                explanationContent.appendChild(renderExplanationNodes(parsedNodes));
            } else {
                // 直接设置 HTML
                explanationContent.innerHTML = explanation;
            }
            
            // 样式由CSS统一控制，只需添加show类
            explanationTitle.style.fontWeight = 'bold';
            explanationTitle.style.textShadow = '0 1px 2px rgba(0, 0, 0, 0.2)';
            closeExplanation.style.fontSize = '1.2rem';
            closeExplanation.style.fontWeight = 'bold';
            
            // 动态定位
            if (positionYPercent !== undefined && positionYPercent !== null) {
                const card = document.querySelector('.card');
                const cardRect = card ? card.getBoundingClientRect() : null;
                if (cardRect) {
                    // 先显示弹窗以获取其高度
                    explanationBox.classList.remove('hide');
                    explanationBox.classList.add('show');
                    
                    const boxHeight = explanationBox.offsetHeight || 200;
                    const winHeight = window.innerHeight;
                    
                    // 计算术语位置
                    let topPos = cardRect.top + (cardRect.height * positionYPercent / 100);
                    
                    // 检查是否超出窗口底部
                    const boxBottom = topPos + boxHeight;
                    if (boxBottom > winHeight - 20) {
                        // 超出底部，显示在术语上方
                        topPos = cardRect.top + (cardRect.height * positionYPercent / 100) - boxHeight - 10;
                        // 如果上方也不够，放到窗口顶部
                        if (topPos < 20) {
                            topPos = 20;
                        }
                    } else {
                        // 正常显示在术语下方，偏移约20px
                        topPos += 20;
                    }
                    
                    explanationBox.style.top = topPos + 'px';
                    // 保持水平居中
                    explanationBox.style.transform = 'translateX(-50%)';
                }
            } else {
                // 使用默认位置
                explanationBox.style.top = '20px';
                explanationBox.style.transform = 'translateX(-50%)';
            }
            
            // 确保移除hide类（如果存在）并添加show类
            explanationBox.classList.remove('hide');
            explanationBox.classList.add('show');
        }
        
        // 隐藏解释框
        function hideExplanation() {
            if (explanationBox) {
                explanationBox.classList.remove('show');
            }
        }
        
        // 为解释内容渲染挖空节点（简化版）
        function renderExplanationNodes(nodes) {
            const container = document.createElement('div');
            
            nodes.forEach(node => {
                if (node.type === 'text') {
                    const span = document.createElement('span');
                    span.innerHTML = node.content;
                    container.appendChild(span);
                } else if (node.type === 'blank') {
                    const blankSpan = document.createElement('span');
                    blankSpan.className = 'blank';
                    blankSpan.textContent = node.content;
                    // 点击展开
                    blankSpan.addEventListener('click', function(e) {
                        e.stopPropagation();
                        if (this.classList.contains('revealed')) {
                            this.classList.remove('revealed');
                        } else {
                            this.classList.add('revealed');
                        }
                    });
                    // 触摸展开
                    blankSpan.addEventListener('touchend', function(e) {
                        e.stopPropagation();
                        e.preventDefault();
                        if (this.classList.contains('revealed')) {
                            this.classList.remove('revealed');
                        } else {
                            this.classList.add('revealed');
                        }
                    });
                    container.appendChild(blankSpan);
                } else if (node.type === 'explanation') {
                    // 名词解释标记不应该出现在解释内容中，直接显示文本
                    const span = document.createElement('span');
                    span.innerHTML = node.term + (node.explanation ? '：' + node.explanation : '');
                    container.appendChild(span);
                }
            });
            
            return container;
        }
        
        // 设置关闭按钮事件
        function setupCloseButton() {
            if (!closeExplanation) return;
            
            const handleCloseClick = function(event) {
                event.stopPropagation();
                if (event.touches && event.type.includes('touch')) {
                    event.preventDefault(); // 防止触摸事件触发两次
                }
                hideExplanation();
            };
            
            closeExplanation.addEventListener('click', handleCloseClick);
            closeExplanation.addEventListener('touchend', handleCloseClick);
        }
        
        // 设置文档点击事件
        function setupDocumentClick() {
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.term') && !e.target.closest('.explanation-box')) {
                    hideExplanation();
                }
            });
            // iOS 需要同时监听 touch 事件
            document.addEventListener('touchend', function(e) {
                if (!e.target.closest('.term') && !e.target.closest('.explanation-box')) {
                    hideExplanation();
                }
            });
        }
        
        // 公共API
        return {
            init: init,
            showExplanation: showExplanation,
            hideExplanation: hideExplanation
        };
    })();
    
    // 挖空模块封装
    const BlankModule = (function() {
        // 私有变量
        let blanksEnabled = true;
        
        // 初始化模块
        function init(enabled = true) {
            blanksEnabled = enabled;
        }
        
        // 解析文本中的挖空标记
        function parseBlanks(text) {
            const blanks = [];
            let i = 0;
            
            while (i < text.length) {
                // 检查挖空开始
                if (text.substring(i, i + 2) === '[[') {
                    const endIndex = findMatchingEnd(text, i, '[[', ']]');
                    if (endIndex !== -1) {
                        const innerText = text.substring(i + 2, endIndex);
                        
                        blanks.push({
                            start: i,
                            end: endIndex + 2,
                            content: innerText
                        });
                        
                        i = endIndex + 2;
                        continue;
                    }
                }
                i++;
            }
            
            return blanks;
        }
        
        // 找到匹配的结束标记
        function findMatchingEnd(text, startIndex, startMarker, endMarker) {
            let depth = 1;
            let i = startIndex + startMarker.length;
            
            while (i < text.length) {
                if (text.substring(i, i + startMarker.length) === startMarker) {
                    depth++;
                    i += startMarker.length;
                } else if (text.substring(i, i + endMarker.length) === endMarker) {
                    depth--;
                    if (depth === 0) {
                        return i;
                    }
                    i += endMarker.length;
                } else {
                    i++;
                }
            }
            
            return -1; // 没有找到匹配的结束标记
        }
        
        // 创建挖空元素
        function createBlankElement(content, setupElementEvents, renderNodes, fieldType = 'other') {
            const blankSpan = document.createElement('span');
            blankSpan.className = 'blank';
            
            // 解析挖空内容（可能包含名词解释）
            const innerNodes = renderNodes(content, fieldType);
            
            // 根据挖空开关和字段类型决定初始状态
            if (!blanksEnabled || fieldType === 'original' || fieldType === 'summary' || fieldType === 'analysis' || fieldType === 'notes') {
                blankSpan.classList.add('revealed');
            }

            blankSpan.appendChild(innerNodes);

            // 确保嵌套在未揭示挖空内的名解默认隐藏
            if (!blankSpan.classList.contains('revealed')) {
                const nestedTerms = blankSpan.querySelectorAll('.term');
                nestedTerms.forEach(term => {
                    term.style.visibility = 'hidden';
                });
            }

            // 添加点击事件 - 揭示挖空内容，兼容iOS
            setupElementEvents(blankSpan, function(e) {
                if (blanksEnabled && fieldType !== 'original' && fieldType !== 'summary' && fieldType !== 'analysis' && fieldType !== 'notes' && !this.classList.contains('revealed')) {
                    revealBlank(this);
                    // 阻止事件冒泡，防止触发名词解释的点击事件
                    e.stopPropagation();
                }
            });
            
            return blankSpan;
        }
        
        // 揭示挖空内容
        function revealBlank(blankElement) {
            if (!blankElement) return;
            
            blankElement.classList.add('revealed');
            // 恢复嵌套名解的可见性
            const nestedTerms = blankElement.querySelectorAll('.term');
            nestedTerms.forEach(term => {
                term.style.visibility = 'visible';
            });
        }
        
        // 检查挖空是否已揭示
        function isBlankRevealed(blankElement) {
            if (!blankElement) return false;
            return blankElement.classList.contains('revealed');
        }
        
        // 设置挖空开关状态
        function setBlanksEnabled(enabled) {
            blanksEnabled = enabled;
        }
        
        // 获取挖空开关状态
        function getBlanksEnabled() {
            return blanksEnabled;
        }
        
        // 公共API
        return {
            init: init,
            parseBlanks: parseBlanks,
            createBlankElement: createBlankElement,
            revealBlank: revealBlank,
            isBlankRevealed: isBlankRevealed,
            setBlanksEnabled: setBlanksEnabled,
            getBlanksEnabled: getBlanksEnabled
        };
    })();
    
    // 字段模块封装
    const FieldModule = (function() {
        // 生成字段容器
        function createFieldContainer(fieldId, fieldName, content, fieldType = 'other') {
            // 创建容器元素
            const container = document.createElement('div');
            container.className = 'trapezoid-container';
            container.id = fieldId + '-container';

            // 根据字段类型添加不同的类名
            if (fieldType === 'analysis') {
                container.classList.add('analysis-field');
            } else if (fieldType === 'other') {
                container.classList.add('other-field');
            }

            // 创建梯形标签
            const trapezoid = document.createElement('div');
            trapezoid.className = 'trapezoid';
            trapezoid.innerHTML = `<span>${fieldName}</span>`;

            // 创建矩形内容区域
            const rectangle = document.createElement('div');
            rectangle.className = 'rectangle';

            // 创建内容容器
            const contentDiv = document.createElement('div');
            contentDiv.className = 'field-content';

    // 辅助函数：找到匹配的结束标记
    function findMatchingEnd(text, startIndex, startMarker, endMarker) {
        let depth = 1;
        let i = startIndex + startMarker.length;
        
        while (i < text.length) {
            if (text.substring(i, i + startMarker.length) === startMarker) {
                depth++;
                i += startMarker.length;
            } else if (text.substring(i, i + endMarker.length) === endMarker) {
                depth--;
                if (depth === 0) {
                    return i;
                }
                i += endMarker.length;
            } else {
                i++;
            }
        }
        
        return -1; // 没有找到匹配的结束标记
    }
    
    // 解析器 - 支持嵌套标记
    function parseText(text) {
        const nodes = [];
        let i = 0;
        
        while (i < text.length) {
            // 检查名词解释开始
            if (text.substring(i, i + 2) === '【*') {
                const endIndex = findMatchingEnd(text, i, '【*', '*】');
                if (endIndex !== -1) {
                    const innerText = text.substring(i + 2, endIndex);
                    const separatorIndex = innerText.indexOf('::');
                    
                    if (separatorIndex !== -1) {
                        const term = innerText.substring(0, separatorIndex);
                        const explanationText = innerText.substring(separatorIndex + 2);
                        
                        nodes.push({
                            type: 'explanation',
                            term: term,
                            explanation: explanationText
                        });
                        
                        i = endIndex + 2;
                        continue;
                    }
                }
                // 未找到闭合标记，作为普通文本处理
            }
            
            // 检查挖空开始
            if (text.substring(i, i + 2) === '[[') {
                const endIndex = findMatchingEnd(text, i, '[[', ']]');
                if (endIndex !== -1) {
                    const innerText = text.substring(i + 2, endIndex);
                    
                    nodes.push({
                        type: 'blank',
                        content: innerText
                    });
                    
                    i = endIndex + 2;
                    continue;
                }
                // 未找到闭合标记，作为普通文本处理
            }
            
            // 普通文本
            let j = i;
            while (j < text.length) {
                if (text.substring(j, j + 2) === '【*' || text.substring(j, j + 2) === '[[') {
                    break;
                }
                j++;
            }
            
            if (j > i) {
                nodes.push({
                    type: 'text',
                    content: text.substring(i, j)
                });
            }
            
            // 如果没有找到任何标记，移动到下一个字符
            if (j === i) {
                j = i + 1;
            }
            
            i = j;
        }
        
        return nodes;
    }
    
    // 将解析后的节点转换为DOM元素
    function renderNodes(nodes, fieldType = 'other') {
        const fragment = document.createDocumentFragment();
        
        // 添加双事件处理：click + touch (iOS兼容)
        const setupElementEvents = (element, handler) => {
            const wrappedHandler = function(e) {
                // 防止触摸事件触发两次
                if (e.touches && e.type.includes('touch')) {
                    e.preventDefault();
                }
                handler.call(this, e);
            };
            
            // 添加iOS兼容的触摸事件
            element.addEventListener('click', wrappedHandler);
            element.addEventListener('touchend', wrappedHandler, { passive: false });
        };
        
        nodes.forEach(node => {
            if (node.type === 'text') {
                // 创建临时元素来解析HTML标签
                const tempElement = document.createElement('span');
                tempElement.innerHTML = node.content;
                // 将临时元素的所有子节点添加到fragment中
                while (tempElement.firstChild) {
                    fragment.appendChild(tempElement.firstChild);
                }
            } else if (node.type === 'blank') {
                // 使用BlankModule创建挖空元素
                const blankSpan = BlankModule.createBlankElement(node.content, setupElementEvents, function(content, ft) {
                    const innerNodes = parseText(content);
                    return renderNodes(innerNodes, ft);
                }, fieldType);
                
                // 为iOS添加触摸样式提示
                blankSpan.style.cursor = 'pointer';
                blankSpan.style.userSelect = 'none';
                
                fragment.appendChild(blankSpan);
            } else if (node.type === 'explanation') {
                // 使用ExplanationParserModule创建术语元素
                const termSpan = ExplanationParserModule.createTermElement(node.term, node.explanation, setupElementEvents);
                // 为iOS添加触摸样式提示
                termSpan.style.cursor = 'pointer';
                termSpan.style.userSelect = 'none';
                
                fragment.appendChild(termSpan);
            }
        });
        
        return fragment;
    }
    
    // 处理文本内容，支持挖空和名词解释
    function processFieldContent(element) {
        if (!element) return;
        
        const originalContent = element.innerHTML;
        
        let parsedNodes;
        try {
            parsedNodes = parseText(originalContent);
        } catch (e) {
            console.warn('Error parsing text, using raw content:', e);
            // 解析失败时，直接显示原始内容
            element.textContent = originalContent;
            return;
        }
        
        // 检查解析结果是否有效
        if (!parsedNodes || parsedNodes.length === 0) {
            element.textContent = originalContent;
            return;
        }
        
        element.innerHTML = '';
        
        // 确定当前字段类型
        let fieldType = 'other';
        if (element.id === 'back-original-text') {
            fieldType = 'original';
        } else if (element.id === 'back-summary') {
            fieldType = 'summary';
        }
        
        element.appendChild(renderNodes(parsedNodes, fieldType));
    }
    
    // 按钮组组件 - 精简版
    const OtherFieldsButtonsModule = (function() {
        let container = null;
        let toggleButton = null;
        let buttonsWrapper = null;
        
        let isDragging = false;
        let hasDragged = false;
        let startX = 0, startY = 0;
        let isLeftSide = true; // 默认在左边
        let startTop = 0;
        let resizeTimeout = null;

        const DRAG_THRESHOLD = 15;
        const STORAGE_KEY_POSITION = 'otherFieldsButtonsPosition';
        const STORAGE_KEY_COLLAPSED = 'otherFieldsButtonsCollapsed';
        
        function init(containerElement) {
            container = containerElement;
            if (!container) return;
            
            container.style.userSelect = 'none';
            container.style.webkitUserSelect = 'none';
            container.style.touchAction = 'none';
            container.style.webkitTouchCallout = 'none';
            
            initDOM();
            initEvents();
            loadState();
        }
        
        function initDOM() {
            toggleButton = container.querySelector('.toggle-button');
            buttonsWrapper = container.querySelector('.other-fields-buttons');
        }
        
        function initEvents() {
            if (!container || !toggleButton) return;

            const dragHandle = container.querySelector('.drag-handle');
            if (dragHandle) {
                dragHandle.addEventListener('mousedown', startDrag);
                dragHandle.addEventListener('touchstart', startDrag, { passive: false });
            }

            toggleButton.addEventListener('click', handleToggleClick);
            toggleButton.addEventListener('touchend', handleToggleClick);
        }
        
        function startDrag(e) {
            const point = e.touches ? e.touches[0] : e;
            startX = point.clientX;
            startY = point.clientY;
            
            const rect = container.getBoundingClientRect();
            const card = document.querySelector('.card');
            const cardRect = card ? card.getBoundingClientRect() : null;
            
            // 判断当前在左边还是右边
            const cardCenterX = cardRect ? (cardRect.left + cardRect.right) / 2 : window.innerWidth / 2;
            isLeftSide = rect.left < cardCenterX;
            
            // 记录初始top位置
            startTop = rect.top;
            
            // 不立即标记为正在拖动，等待移动超过阈值
            // isDragging 和 hasDragging 会在 onDrag 中设置
            
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchmove', onDrag, { passive: false });
            document.addEventListener('touchend', stopTouchDrag);
            
            if (e.cancelable) e.preventDefault();
        }
        
        function onDrag(e) {
            if (e.cancelable) e.preventDefault();
            
            const point = e.touches ? e.touches[0] : e;
            const deltaX = Math.abs(point.clientX - startX);
            const deltaY = Math.abs(point.clientY - startY);
            
            if (!hasDragged && (deltaX > DRAG_THRESHOLD || deltaY > DRAG_THRESHOLD)) {
                hasDragged = true;
                isDragging = true;
                container.classList.add('dragging');
            }
            
            if (!isDragging) return;
            
            // 检测是否需要切换到另一边
            const card = document.querySelector('.card');
            const cardRect = card ? card.getBoundingClientRect() : null;
            if (cardRect) {
                const cardCenterX = (cardRect.left + cardRect.right) / 2;
                // 如果拖拽到了卡片中心的另一侧，切换边
                if (isLeftSide && point.clientX > cardCenterX) {
                    isLeftSide = false;
                } else if (!isLeftSide && point.clientX < cardCenterX) {
                    isLeftSide = true;
                }
            }
            
            updatePosition(point.clientX, point.clientY);
        }
        
        function updatePosition(clientX, clientY) {
            // 如果没有在拖动，不更新位置
            if (!isDragging) return;
            
            const deltaY = clientY - startY;
            
            const card = document.querySelector('.card');
            const cardRect = card ? card.getBoundingClientRect() : null;
            const winWidth = window.innerWidth;
            const winHeight = window.innerHeight;
            
            if (!cardRect) return;
            
            const groupHeight = container.scrollHeight || container.offsetHeight;
            const groupWidth = container.offsetWidth;
            
            // 计算新的top位置
            let newTop = startTop + deltaY;
            
            // 限制在卡片区域内垂直移动
            const minTop = cardRect.top;
            const maxTop = cardRect.bottom - groupHeight;
            newTop = Math.max(minTop, Math.min(maxTop, newTop));
            
            // 始终保持在卡片左右两边贴边
            if (isLeftSide) {
                // 左边贴边
                container.style.left = (cardRect.left) + 'px';
                container.style.right = 'auto';
            } else {
                // 右边贴边
                container.style.left = 'auto';
                container.style.right = (winWidth - cardRect.right) + 'px';
            }
            
            container.style.top = newTop + 'px';
            container.style.bottom = 'auto';
            container.style.transform = 'none';
        }
        
        function stopDrag() {
            const wasDragging = isDragging;
            cleanup();

            if (wasDragging) {
                const rect = container.getBoundingClientRect();
                const card = document.querySelector('.card');
                const cardRect = card ? card.getBoundingClientRect() : null;

                // 保存为相对于卡片高度的百分比
                let topPercent = 50;
                if (cardRect && cardRect.height > 0) {
                    topPercent = ((rect.top - cardRect.top) / cardRect.height) * 100;
                    topPercent = Math.max(0, Math.min(100, topPercent));
                }

                window.ankiStorage.setConfig(STORAGE_KEY_POSITION, {
                    isLeftSide: isLeftSide,
                    topPercent: topPercent
                });
            }

            isDragging = false;
            hasDragged = false;
        }
        
        // 区分触摸和鼠标的拖动/点击
        function stopTouchDrag(e) {
            // 如果触摸时有明显移动，标记为已拖动
            if (isDragging) {
                hasDragged = true;
            }
            
            stopDrag();
        }
        
        function cleanup() {
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', stopDrag);
            document.removeEventListener('touchmove', onDrag);
            document.removeEventListener('touchend', stopDrag);
            container.classList.remove('dragging');

            isDragging = false;
            hasDragged = false;
        }
        
        function handleToggleClick(e) {
            if (hasDragged) {
                hasDragged = false;
                return;
            }
            toggleExpanded();
            e.stopPropagation();
            if (e.type === 'touchend') e.preventDefault();
        }
        
        function toggleExpanded() {
            if (!toggleButton || !buttonsWrapper) return;
            const isCollapsed = toggleButton.classList.toggle('collapsed');
            buttonsWrapper.classList.toggle('collapsed');
            window.ankiStorage.setConfig(STORAGE_KEY_COLLAPSED, isCollapsed);
        }
        
        function loadState() {
            const collapsed = window.ankiStorage.getConfig(STORAGE_KEY_COLLAPSED);
            if (collapsed !== undefined) {
                toggleButton.classList.toggle('collapsed', collapsed);
                buttonsWrapper.classList.toggle('collapsed', collapsed);
            }
            
            applyPosition();
            
            // 监听窗口大小变化，保持相对位置
            window.addEventListener('resize', handleResize);
        }
        
        function applyPosition() {
            const card = document.querySelector('.card');
            const cardRect = card ? card.getBoundingClientRect() : null;
            if (!cardRect || cardRect.width === 0) return;

            const pos = window.ankiStorage.getConfig(STORAGE_KEY_POSITION);
            const winWidth = window.innerWidth;

            const leftSide = pos && pos.isLeftSide !== undefined ? pos.isLeftSide : false;
            const topPercent = pos && pos.topPercent !== undefined ? pos.topPercent : 50;

            if (leftSide) {
                container.style.left = cardRect.left + 'px';
                container.style.right = 'auto';
            } else {
                container.style.left = 'auto';
                container.style.right = (winWidth - cardRect.right) + 'px';
            }

            const topPos = cardRect.top + (cardRect.height * topPercent / 100);
            container.style.top = topPos + 'px';
            container.style.bottom = 'auto';
            container.style.transform = 'none';

            isLeftSide = leftSide;
        }
        
        function handleResize() {
            if (resizeTimeout) clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(applyPosition, 100);
        }
        
        function addButton(fieldName, fieldContent) {
            if (!buttonsWrapper) return;
            
            const btn = document.createElement('button');
            btn.className = 'other-field-button';
            btn.textContent = fieldName;
            
            btn.addEventListener('click', handleButtonClick(fieldName, fieldContent));
            btn.addEventListener('touchend', handleButtonClick(fieldName, fieldContent));
            
            buttonsWrapper.appendChild(btn);
        }
        
        function handleButtonClick(fieldName, fieldContent) {
            return function(e) {
                cleanup();

                if (hasDragged) {
                    hasDragged = false;
                    return;
                }
                if (ExplanationModule.showExplanation) {
                    ExplanationModule.showExplanation(fieldName, fieldContent);
                }
                e.stopPropagation();
                if (e.type === 'touchend') e.preventDefault();
            };
        }
        
        function clearButtons() {
            if (buttonsWrapper) buttonsWrapper.innerHTML = '';
        }
        
        return { init, addButton, clearButtons };
    })();

        function parseKnowledgeAnalysis(content) {

                return [];
            }

            // 按照<br>###分隔符分割内容
            const items = content.split('<br>###');
            const fields = [];

            items.forEach((item, index) => {
                if (item.trim() === '') return;

                const parts = item.split('::');
                if (parts.length >= 2) {
                    const fieldName = parts[0].trim();
                    const fieldContent = parts.slice(1).join('::').trim();

                    fields.push({
                        id: 'analysis-' + index + '-' + fieldName.toLowerCase().replace(/\s+/g, '-'),
                        name: fieldName,
                        content: fieldContent
                    });
                }
            });

            return fields;
        }

        // 渲染知识解析字段
        function renderKnowledgeAnalysis(content, parentElement, fieldType = 'analysis') {
            const fields = parseKnowledgeAnalysis(content);

            fields.forEach(field => {
                FieldModule.addField(field.id, field.name, field.content, parentElement, fieldType);
            });
        }

        // 公共API
        return {
            parseKnowledgeAnalysis: parseKnowledgeAnalysis,
            renderKnowledgeAnalysis: renderKnowledgeAnalysis
        };
    })();

    // 隐藏空字段
    function hideEmptyFields() {
        // 提要
        const summaryContainer = document.getElementById('back-summary-container');
        const summaryContent = document.getElementById('back-summary');
        
        if (summaryContent && summaryContent.textContent.trim() === '') {

    // 检查文本对齐
    function checkTextAlignment(textElement) {
        if (!textElement) return;
        
        const lineHeight = parseFloat(getComputedStyle(textElement).lineHeight);
        const height = textElement.offsetHeight;
        
        // 如果高度超过一行的高度，则为多行（降低阈值到1.2倍）
        if (height > lineHeight * 1.2) {
            textElement.classList.add('multi-line');
        } else {
            textElement.classList.remove('multi-line');
        }
    }
    
    // 强制重新处理文本对齐
    function forceReprocessParagraphIndentation() {
        const originalTextElements = document.querySelectorAll('.original-text');
        originalTextElements.forEach(element => {
            checkTextAlignment(element);
        });
    }
    

    
    // 辅助函数：获取配置
    function getConfig(name, defaultValue) {
        // 1. Try from localStorage
        const storedValue = window.ankiStorage.getConfig(name);
        if (storedValue !== undefined) {
            // Ensure boolean strings are converted
            if (typeof defaultValue === 'boolean') {
                if (storedValue === 'true') return true;
                if (storedValue === 'false') return false;
            }
            // Ensure number strings are converted
            if (typeof defaultValue === 'number' && !isNaN(parseFloat(storedValue))) {
                return parseFloat(storedValue);
            }
            return storedValue;
        }

        // 2. Try from HTML comments
        const regex = new RegExp(`<!-- config:${name}=([\w.-]+) -->`); // Allow . and - for values like eyeCare or numbers
        const configSource = document.documentElement.innerHTML || '';
        const match = configSource.match(regex);
        if (match && match[1]) {
            let value = match[1];
            // Convert boolean strings
            if (typeof defaultValue === 'boolean') {
                if (value === 'true') return true;
                if (value === 'false') return false;
            }
            // Convert number strings
            if (typeof defaultValue === 'number' && !isNaN(parseFloat(value))) {
                return parseFloat(value);
            }
            return value;
        }

        // 3. Try from template defaults (代码顶部定义的默认值)
        let templateDefault = null;
        if (window.ANKI_TEMPLATE_DEFAULTS && window.ANKI_TEMPLATE_DEFAULTS[name] !== undefined) {
            templateDefault = window.ANKI_TEMPLATE_DEFAULTS[name];
            
            // 验证模板默认值的有效性
            const isValid = validateConfigValue(name, templateDefault, defaultValue);
            if (isValid) {
                return templateDefault;
            }
            // 如果无效，使用传入的 defaultValue
        }

        // 4. Return fallback default value
        return defaultValue;
    }
    
    // 验证配置值是否有效
    function validateConfigValue(name, value, defaultValue) {
        if (value === undefined || value === null) return false;
        
        switch (name) {
            case 'revealBlanks':
                return typeof value === 'boolean';
            case 'otherContentMode':
                return value === 'popup' || value === 'inline';
            case 'theme':
                return value === 'system' || value === 'light' || value === 'dark' || value === 'eye-care';
            case 'fontSize':
                return typeof value === 'number' && value >= 12 && value <= 24;
            default:
                return true;
        }
    }
    
    // 设置面板模块
    const SettingsPanelModule = (function() {
        let isOpen = false;

        const configOptions = [
            { key: 'revealBlanks', label: '挖空开关', type: 'toggle', default: true },
            { key: 'otherContentMode', label: '知识扩展', type: 'select', default: 'popup', options: [
                { value: 'inline', label: '页面显示' },
                { value: 'popup', label: '按钮弹窗' }
            ]},
            { key: 'theme', label: '主题选择', type: 'select', default: 'system', options: [
                { value: 'system', label: '跟随系统' },
                { value: 'blue', label: '简约蓝' },
                { value: 'pink', label: '果粉色' },
                { value: 'mint', label: '果冻绿' },
                { value: 'dark', label: '深色模式' },
                { value: 'eye-care', label: '护眼模式' }
            ]},
            { key: 'fontSize', label: '字体大小', type: 'number', default: 16, min: 12, max: 24, step: 1 }
        ];

        function createSettingItem(config) {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'setting-item';

            const label = document.createElement('label');
            label.htmlFor = `setting-${config.key}`;
            label.textContent = config.label;
            itemDiv.appendChild(label);

            if (config.type === 'toggle') {
                const switchContainer = document.createElement('label');
                switchContainer.className = 'toggle-switch-container';
                const input = document.createElement('input');
                input.type = 'checkbox';
                input.id = `setting-${config.key}`;
                input.name = config.key;
                const slider = document.createElement('span');
                slider.className = 'toggle-switch-slider';
                switchContainer.appendChild(input);
                switchContainer.appendChild(slider);

                switchContainer.addEventListener('click', function(event) {
                    event.stopPropagation();
                    const isChecked = input.checked;
                    input.checked = !isChecked;
                    input.dispatchEvent(new Event('change'));
                });
                switchContainer.addEventListener('touchend', function(event) {
                    // 在iOS上必须调用preventDefault()来防止触摸事件触发两次
                    event.preventDefault();
                    event.stopPropagation();
                    const isChecked = input.checked;
                    input.checked = !isChecked;
                    input.dispatchEvent(new Event('change'));
                }, { passive: false });
                
                itemDiv.appendChild(switchContainer);
            } else if (config.type === 'number') {
                const adjusterContainer = document.createElement('div');
                adjusterContainer.className = 'setting-number-adjuster';
                
                const minusButton = document.createElement('button');
                minusButton.type = 'button';
                minusButton.className = 'setting-adjust-button minus';
                minusButton.textContent = '−';
                minusButton.setAttribute('aria-label', '减少');
                
                const valueSpan = document.createElement('span');
                valueSpan.id = `setting-${config.key}`;
                valueSpan.className = 'setting-number-value';
                valueSpan.textContent = config.default;
                
                const plusButton = document.createElement('button');
                plusButton.type = 'button';
                plusButton.className = 'setting-adjust-button plus';
                plusButton.textContent = '+';
                plusButton.setAttribute('aria-label', '增加');

                // 为数字调节器按钮添加双事件支持
                function addButtonEvents(button, callback) {
                    button.addEventListener('click', function(e) {
                        e.stopPropagation();
                        callback();
                    });
                    button.addEventListener('touchend', function(e) {
                        e.stopPropagation();
                        callback();
                    }, { passive: false });
                }
                
                addButtonEvents(minusButton, () => {
                    let currentValue = parseInt(valueSpan.textContent, 10);
                    const step = config.step || 1;
                    const min = config.min !== undefined ? config.min : -Infinity;
                    if (!isNaN(currentValue)) {
                        currentValue = Math.max(min, currentValue - step);
                        valueSpan.textContent = currentValue;
                    }
                });
                
                addButtonEvents(plusButton, () => {
                    let currentValue = parseInt(valueSpan.textContent, 10);
                    const step = config.step || 1;
                    const max = config.max !== undefined ? config.max : Infinity;
                    if (!isNaN(currentValue)) {
                        currentValue = Math.min(max, currentValue + step);
                        valueSpan.textContent = currentValue;
                    }
                });
                
                adjusterContainer.appendChild(minusButton);
                adjusterContainer.appendChild(valueSpan);
                adjusterContainer.appendChild(plusButton);
                itemDiv.appendChild(adjusterContainer);
            } else if (config.type === 'select') {
                const selectContainer = document.createElement('div');
                selectContainer.className = 'setting-select-container';
                
                const selectElement = document.createElement('select');
                selectElement.id = `setting-${config.key}`;
                selectElement.name = config.key;
                selectElement.className = 'setting-select';
                
                // 添加选项
                config.options.forEach(option => {
                    const optionElement = document.createElement('option');
                    optionElement.value = option.value;
                    optionElement.textContent = option.label;
                    selectElement.appendChild(optionElement);
                });
                
                selectElement.addEventListener('click', function(event) {
                    event.stopPropagation();
                });
                selectElement.addEventListener('touchend', function(event) {
                    event.stopPropagation();
                }, { passive: false });
                
                selectContainer.appendChild(selectElement);
                itemDiv.appendChild(selectContainer);
            }
            return itemDiv;
        }

        function populatePanel() {
            const panelBody = document.getElementById('anki-settings-panel-body');
            if (!panelBody) return;
            
            panelBody.innerHTML = ''; // Clear previous items
            
            // 添加AI生成内容提示
            const aiNotice = document.createElement('div');
            aiNotice.style.cssText = `
                padding: 10px 14px;
                margin-bottom: 15px;
                background: rgba(255, 255, 255, 0.1);
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 6px;
                font-size: 12px;
                line-height: 1.6;
                color: rgba(255, 255, 255, 0.85);
                text-align: center;
            `;
            aiNotice.textContent = '本学习卡片仅供学习参考，辅助学习，如与实际有偏差请以实际为准';
            panelBody.appendChild(aiNotice);
            
            configOptions.forEach(config => {
                const currentValue = getConfig(config.key, config.default);
                const itemElement = createSettingItem(config);
                const inputElement = itemElement.querySelector(`#setting-${config.key}`);
                
                if (inputElement) {
                    if (config.type === 'toggle') {
                        const boolValue = currentValue === true || String(currentValue).toLowerCase() === 'true';
                        inputElement.checked = boolValue;
                    } else if (config.type === 'number') {
                        inputElement.textContent = parseInt(currentValue, 10) || config.default;
                    } else if (config.type === 'select') {
                        inputElement.value = currentValue || config.default;
                    }
                }
                panelBody.appendChild(itemElement);
            });
        }

        function openPanel() {
            const settingsPanel = document.getElementById('anki-settings-panel');
            if (!settingsPanel) return;
            
            isOpen = true;
            settingsPanel.classList.add('visible');
        }

        function closePanel() {
            const settingsPanel = document.getElementById('anki-settings-panel');
            if (!settingsPanel) return;
            
            isOpen = false;
            settingsPanel.classList.remove('visible');
        }

        function togglePanel() {
            if (isOpen) {
                closePanel();
            } else {
                openPanel();
            }
        }

        function applySettings() {
            // 应用字体大小设置 - 通过CSS变量统一控制
            const fontSize = getConfig('fontSize', 16);
            document.documentElement.style.setProperty('--base-font-size', fontSize + 'px');
            
            // 应用自动隐藏空字段设置
            const autoHideEmpty = getConfig('autoHideEmpty', true);
            if (autoHideEmpty) {
                hideEmptyFields();
            }
            
            // 应用主题设置
            applyTheme();
        }
        
        function applyTheme() {
            const theme = getConfig('theme', 'system');
            const html = document.documentElement;
            
            // 移除所有主题类
            html.classList.remove('theme-blue', 'theme-pink', 'theme-mint', 'theme-dark', 'theme-eye-care');
            
            // 应用对应的主题
            if (theme === 'system') {
                // 检测系统主题偏好
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                html.classList.add(prefersDark ? 'theme-dark' : 'theme-blue');
                
                // 监听系统主题变化
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                    const currentTheme = getConfig('theme', 'system');
                    if (currentTheme === 'system') {
                        html.classList.remove('theme-blue', 'theme-dark');
                        html.classList.add(e.matches ? 'theme-dark' : 'theme-blue');
                    }
                });
            } else if (theme === 'blue') {
                html.classList.add('theme-blue');
            } else if (theme === 'pink') {
                html.classList.add('theme-pink');
            } else if (theme === 'mint') {
                html.classList.add('theme-mint');
            } else if (theme === 'dark') {
                html.classList.add('theme-dark');
            } else if (theme === 'eye-care') {
                html.classList.add('theme-eye-care');
            }
        }

        function saveSettings() {
            const panelBody = document.getElementById('anki-settings-panel-body');
            if (!panelBody) return;
            
            // 获取旧模式
            const oldMode = getConfig('otherContentMode', 'popup');
            let newMode = oldMode;
            
            configOptions.forEach(config => {
                const inputElement = panelBody.querySelector(`#setting-${config.key}`);
                let value;
                
                if (config.type === 'toggle') {
                    value = inputElement.checked;
                } else if (config.type === 'number') {
                    value = parseInt(inputElement.textContent, 10);
                    if (isNaN(value)) value = config.default;
                    if (config.min !== undefined && value < config.min) value = config.min;
                    if (config.max !== undefined && value > config.max) value = config.max;
                } else if (config.type === 'select') {
                    value = inputElement.value;
                    if (config.key === 'otherContentMode') {
                        newMode = value;
                    }
                }
                
                window.ankiStorage.setConfig(config.key, value);
            });
            
            // 如果模式变化，重置按钮位置
            if (oldMode !== newMode) {
                resetButtonsPosition();
            }
            
            console.log("Settings saved to localStorage.");
            
            // 显示提示
            showSettingsSavedToast();
            
            applySettings();
        }
        
        // 显示设置保存提示
        function showSettingsSavedToast() {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(0, 0, 0, 0.8);
                color: white;
                padding: 12px 20px;
                border-radius: 6px;
                font-size: 14px;
                z-index: 10000;
                pointer-events: none;
                animation: fadeInOut 2s ease-in-out;
                max-width: 90%;
                text-align: center;
            `;
            toast.textContent = '部分配置将在下一张卡片应用';
            document.body.appendChild(toast);
            
            // 添加动画样式
            const style = document.createElement('style');
            style.textContent = `
                @keyframes fadeInOut {
                    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
                    15% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
                    85% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
                    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
                }
            `;
            document.head.appendChild(style);
            
            setTimeout(() => {
                if (document.body.contains(toast)) {
                    document.body.removeChild(toast);
                }
            }, 2000);
        }
        
        // 重置按钮位置
        function resetButtonsPosition() {
            // 清除保存的位置
            window.ankiStorage.setConfig('otherFieldsButtonsPosition', null);
            
            // 应用位置 - 使用CSS默认的右边位置
            const container = document.getElementById('other-fields-buttons-container');
            if (container) {
                container.style.right = '10px';
                container.style.left = 'auto';
                container.style.top = '50%';
                container.style.bottom = 'auto';
                container.style.transform = 'translateY(-50%)';
            }
        }

        function handleResetSettings() {
            if (confirm("您确定要将所有卡片设置恢复为默认值吗？此操作不可撤销。")) {
                const configPrefix = 'anki_cfg_';
                configOptions.forEach(config => {
                    try {
                        localStorage.removeItem(configPrefix + config.key);
                    } catch (e) {
                        console.warn(`Error removing ${configPrefix + config.key} from localStorage`, e);
                    }
                });
                
                // 重置按钮位置
                try {
                    localStorage.removeItem('otherFieldsButtonsPosition');
                    localStorage.removeItem('otherFieldsButtonsCollapsed');
                } catch (e) {
                    console.warn('Error removing button position from localStorage', e);
                }
                
                // 重置按钮组到默认位置（右边）
                const buttonsContainer = document.getElementById('other-fields-buttons-container');
                if (buttonsContainer) {
                    buttonsContainer.style.right = '10px';
                    buttonsContainer.style.left = 'auto';
                    buttonsContainer.style.top = '50%';
                    buttonsContainer.style.bottom = 'auto';
                    buttonsContainer.style.transform = 'translateY(-50%)';
                }
                
                console.log("All settings reset to defaults (localStorage cleared).");
                
                // 显示提示
                showSettingsSavedToast();
                
                applySettings();
            }
        }

        function init() {
            const settingsButton = document.getElementById('anki-settings-button');
            const settingsPanel = document.getElementById('anki-settings-panel');
            const settingsCloseButton = document.getElementById('anki-settings-close-button');
            const settingsSaveButton = document.getElementById('anki-settings-save-button');
            const settingsResetButton = document.getElementById('anki-settings-reset-button');

            // 辅助函数：为元素添加双事件处理（点击和触摸）
            function addDualEvent(element, callback) {
                if (!element) return;
                
                // 添加点击事件
                element.addEventListener('click', function(e) {
                    e.stopPropagation();
                    callback();
                });
                
                // 添加触摸事件，支持iOS设备
                element.addEventListener('touchend', function(e) {
                    e.stopPropagation();
                    callback();
                }, { passive: false });
                
                // 为iOS添加触摸样式提示
                element.style.cursor = 'pointer';
                element.style.userSelect = 'none';
            }
            
            addDualEvent(settingsButton, () => togglePanel());
            addDualEvent(settingsCloseButton, () => closePanel());
            addDualEvent(settingsSaveButton, () => {
                saveSettings();
                closePanel();
            });
            addDualEvent(settingsResetButton, () => handleResetSettings());

            // 添加ESC键关闭设置面板
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape' && isOpen) {
                    closePanel();
                }
            });

            // 点击面板外部关闭设置面板
            if (settingsPanel) {
                settingsPanel.addEventListener('click', function(event) {
                    if (event.target === settingsPanel) {
                        closePanel();
                    }
                });
            }
            
            // 填充设置面板
            populatePanel();
        }

        return {
            init: init,
            applySettings: applySettings
        };
    })();
    
    // 确保DOM完全加载
    function safeInit() {
        try {
            // 初始化主要功能
            init();
            
            // 初始化设置面板
            SettingsPanelModule.init();
            
            // 隐藏空的章节
            hideEmptyChapter();
            
            // 应用当前设置
            SettingsPanelModule.applySettings();
            
            // 额外为设置按钮添加直接的触摸事件支持
            const settingsButton = document.getElementById('anki-settings-button');
            if (settingsButton) {
                // 确保移除所有之前的事件监听器
                settingsButton.removeEventListener('click', handleSettingsButtonTouch);
                settingsButton.removeEventListener('touchend', handleSettingsButtonTouch);
                
                // 定义一个简单的处理函数
                function handleSettingsButtonTouch(e) {
                    e.stopPropagation();
                    e.preventDefault();
                    // 直接调用togglePanel函数
                    if (typeof SettingsPanelModule.togglePanel === 'function') {
                        SettingsPanelModule.togglePanel();
                    } else {
                        // 作为后备方案，直接操作样式
                        const panel = document.getElementById('anki-settings-panel');
                        if (panel) {
                            panel.classList.toggle('show');
                        }
                    }
                }
                
                // 添加直接的事件监听器
                settingsButton.addEventListener('click', handleSettingsButtonTouch);
                settingsButton.addEventListener('touchend', handleSettingsButtonTouch, { passive: false });
            }
        } catch (error) {
            console.error('初始化错误:', error);
        }
    }
    
    // 立即执行初始化
    safeInit();
})();

// 复制微信号到剪贴板
window.copyWechatToClipboard = function() {
    const wechatNumber = 'kikkua2649';
    
    // 方法1: 使用现代 Clipboard API
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(wechatNumber).then(function() {
            showCopySuccess();
        }).catch(function(err) {
            console.error('Clipboard API failed:', err);
            fallbackCopy(wechatNumber);
        });
    } else {
        // 方法2: 回退到传统方法
        fallbackCopy(wechatNumber);
    }
};

function fallbackCopy(text) {
    // 创建临时文本区域
    const textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.left = '-999999px';
    textArea.style.top = '-999999px';
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    
    try {
        const successful = document.execCommand('copy');
        if (successful) {
            showCopySuccess();
        } else {
            showCopyError();
        }
    } catch (err) {
        console.error('Fallback copy failed:', err);
        showCopyError();
    }
    
    document.body.removeChild(textArea);
}

function showCopySuccess() {
    if (window.anki && window.anki.showToast) {
        window.anki.showToast('微信号已复制到剪贴板');
    } else {
        // 创建临时提示
        const toast = document.createElement('div');
        toast.style.cssText = `
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 10000;
            pointer-events: none;
        `;
        toast.textContent = '微信号已复制';
        document.body.appendChild(toast);
        
        setTimeout(() => {
            if (document.body.contains(toast)) {
                document.body.removeChild(toast);
            }
        }, 2000);
    }
}

function showCopyError() {
    if (window.anki && window.anki.showToast) {
        window.anki.showToast('复制失败，请手动复制');
    } else {
        alert('复制失败，请手动复制微信号：kikkua2649');
    }
}

// 根据等级数字添加对应CSS类
function applyLevelStyling() {
    const settingsButton = document.getElementById('anki-settings-button');
    if (settingsButton) {
        const levelText = settingsButton.textContent.trim();
        settingsButton.classList.remove('level-1', 'level-2', 'level-3', 'settings-icon');
        
        if (levelText === '1') {
            settingsButton.classList.add('level-1');
        } else if (levelText === '2') {
            settingsButton.classList.add('level-2');
        } else if (levelText === '3') {
            settingsButton.classList.add('level-3');
        } else {
            settingsButton.textContent = '⚙️';
            settingsButton.classList.add('settings-icon');
        }
    }
}

// 当DOM内容加载完成后应用等级样式
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', applyLevelStyling);
} else {
    applyLevelStyling();
}
</script>
