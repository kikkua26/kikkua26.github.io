<template id="ak-back"><!-- 背面模板 - 显示所有字段 -->
<div id="explanationBox" class="explanation-box">
    <div class="explanation-header">
        <span class="explanation-title" id="explanationTitle">术语</span>
        <button class="close-btn" id="closeExplanation">&times;</button>
    </div>
    <div class="explanation-content" id="explanationContent">
        <!-- 解释内容将显示在这里 -->
    </div>
</div>
<div class="card-header">
    <div class="chapter" id="chapter-display">{{章节}}</div>
    <div id="anki-settings-button" class="settings-button" title="设置">{{等级}}</div>
</div>

<!-- 设置面板 -->
<div id="anki-settings-panel" class="settings-panel">
    <div class="settings-panel-content">
        <div class="settings-panel-header">
            <span>卡片设置</span>
            <div class="settings-header-actions">
                <button id="anki-settings-reset-button" class="settings-reset-button">恢复</button>
                <button id="anki-settings-save-button" class="settings-save-button">应用</button>
                <span id="anki-settings-close-button" class="settings-close-button" title="关闭">×</span>
            </div>
        </div>
        <div class="settings-panel-body" id="anki-settings-panel-body">
            <!-- 配置项将在这里动态添加 -->
        </div>
        <div class="settings-panel-footer">
            <div class="settings-footer-info-block">
                <!-- 联系信息行 -->
                <div class="footer-contact-row">
                    <div class="footer-contact-left">
                        <span class="footer-contact-label">售后微信：</span>
                        <span class="footer-contact-value" id="footer-wechat" onclick="copyWechatToClipboard()">kikkua2649</span>
                    </div>
                    <div class="footer-contact-right">
                        <a href="https://xhslink.com/m/5z1Ljdb8ogH" target="_blank" class="footer-xhs-link" title="小红书">
                            <span class="footer-xhs-icon">📕</span>
                            <span>小红书</span>
                        </a>
                    </div>
                </div>
                
                <!-- 授权和获取正版行 -->
                <div class="footer-auth-row" id="auth-row-container">
                    <div class="footer-auth-left">
                        <span class="footer-auth-label">溯源码：</span>
                        <span class="footer-auth-value" id="auth-code-display"></span>
                    </div>
                    <div class="footer-auth-right">
                        <a href="https://xhslink.com/m/5z1Ljdb8ogH" target="_blank" class="footer-buy-link">获取正版</a>
                    </div>
                </div>
                
                
                
                <!-- 版权声明 -->
                <div class="footer-copyright">
                    @2025 kikkua V2.9.1 仅个人学习使用，禁止商用
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 授权提示工具提示 -->
<div class="footer-auth-tooltip" id="footer-auth-tooltip">
    <strong>版权声明</strong>
    本牌组模板受知识产权法保护。未经授权的复制、分发或修改将构成侵权行为。创作不易，感谢支持！
</div>

<div class="content">
    <!-- 主字段 -->
    <div class="original-field">
        <p class="original-text">
                    <span id="back-original-text">{{主字段}}</span>
                </p>
    </div>
    
    <!-- 提要插槽 -->
    <div class="summary-container" id="back-summary-container">
        <div class="summary-label">提要</div>
        <div class="summary-content" id="back-summary">{{提要}}</div>
    </div>

    <!-- 用户笔记字段 -->
    <div class="notes-container collapsed" id="notes-container">
        <div class="notes-header" onclick="toggleNotes('back')">
            <div class="notes-label">笔记</div>
            <span class="notes-toggle">▼</span>
        </div>
        <div class="notes-content" id="back-notes">{{用户笔记}}</div>
    </div>
    
    <!-- 知识扩展字段 -->
    <div class="trapezoid-container" id="other-content-container">
        <div class="trapezoid">
            <span>知识扩展</span>
        </div>
        <div class="rectangle">
            <div class="field-content" id="back-other-content">
                {{知识拓展}}
            </div>
        </div>
    </div>
    
    <!-- 知识解析字段 -->
    <div class="trapezoid-container" id="knowledge-analysis-container" style="display: none;">
        <div class="trapezoid">
            <span>知识解析</span>
        </div>
        <div class="rectangle">
            <div class="field-content" id="back-knowledge-analysis">
                {{知识解析}}
            </div>
        </div>
    </div>
</div>

<!-- 其他字段按钮容器 -->
<div class="other-fields-buttons-container" id="other-fields-buttons-container" style="right: 10px; top: 50%; transform: translateY(-50%); display: none;">
    <!-- 收起/展开按钮 -->
    <div class="toggle-button" id="toggle-other-fields">
        <span class="toggle-icon">▼</span>
    </div>
    <!-- 拖动手柄 -->
    <div class="drag-handle" id="drag-handle">
        <span>⋮⋮</span>
    </div>
    <!-- 按钮将动态生成 -->
    <div class="other-fields-buttons" id="other-fields-buttons">
        <!-- 动态按钮将添加到这里 -->
    </div>
</div>
