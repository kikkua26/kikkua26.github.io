<script>
// ==================== 工具函数 ====================
// 生成设备标识授权号（用于版权保护威慑）
function generateAuthCode() {
    const deviceInfo = [
        navigator.userAgent,
        screen.width,
        screen.height,
        navigator.language,
        new Date().getTime().toString().substring(0, 8)
    ].join('');

    function simpleHash(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            const char = str.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash;
        }
        return Math.abs(hash);
    }

    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    const hashValue = simpleHash(deviceInfo);
    let result = '';

    for (let i = 0; i < 12; i++) {
        const index = (hashValue * (i + 1)) % chars.length;
        result += chars.charAt(index);
    }

    return result.replace(/(.{4})/g, '$1-').slice(0, -1);
}

// ==================== 增强版存储模块 ====================
window.ankiStorage = (function() {
    const prefix = 'anki_sel_';
    const configPrefix = 'anki_cfg_';

    return {
        set: function(key, data) {
            const safeKey = prefix + btoa(encodeURIComponent(key)).slice(0, 50);
            try {
                localStorage.setItem(safeKey, JSON.stringify(data));
            } catch(e) {
                console.warn('localStorage setItem failed, falling back to window object for key:', safeKey, e);
                window[safeKey] = data;
            }
        },
        get: function(key) {
            const safeKey = prefix + btoa(encodeURIComponent(key)).slice(0, 50);
            try {
                const data = localStorage.getItem(safeKey);
                return data ? JSON.parse(data) : null;
            } catch(e) {
                console.warn('localStorage getItem failed, falling back to window object for key:', safeKey, e);
                return window[safeKey] || null;
            }
        },
        clear: function(key) {
            const safeKey = prefix + btoa(encodeURIComponent(key)).slice(0, 50);
            try {
                localStorage.removeItem(safeKey);
            } catch(e) {
                console.warn('localStorage removeItem failed, attempting to delete from window object for key:', safeKey, e);
                delete window[safeKey];
            }
        },
        // Config-specific methods
        setConfig: function(configKey, value) {
            try {
                localStorage.setItem(configPrefix + configKey, JSON.stringify(value));
            } catch (e) {
                console.error('Error saving config to localStorage:', configKey, e);
            }
        },
        getConfig: function(configKey) {
            try {
                const value = localStorage.getItem(configPrefix + configKey);
                return value !== null ? JSON.parse(value) : undefined; // Return undefined if not found
            } catch (e) {
                console.error('Error reading config from localStorage:', configKey, e);
                return undefined;
            }
        }
    };
})();

// 正面模板的JavaScript
(function() {
    // 隐藏空的章节
    function hideEmptyChapter() {
        const chapter = document.getElementById('chapter-display');
        if (chapter) {
            const text = chapter.textContent.trim();
            if (!text) {
                chapter.style.display = 'none';
            }
        }
    }
    
    // 全局变量
    const explanationBox = document.getElementById('explanationBox');
    const explanationTitle = document.getElementById('explanationTitle');
    const explanationContent = document.getElementById('explanationContent');
    const closeExplanation = document.getElementById('closeExplanation');
    
    // 名词解释模块封装
    const ExplanationModule = (function() {
        // 私有变量
        let explanationBox = null;
        let explanationTitle = null;
        let explanationContent = null;
        let closeExplanation = null;
        
        // 初始化模块
        function init(box, title, content, closeBtn) {
            explanationBox = box;
            explanationTitle = title;
            explanationContent = content;
            closeExplanation = closeBtn;
            
            // 设置关闭按钮事件
            setupCloseButton();
            
            // 点击页面其他地方关闭解释框
            setupDocumentClick();
        }
        
        // 解析文本中的名词解释标记
        function parseExplanations(text) {
            const explanations = [];
            let i = 0;
            
            while (i < text.length) {
                // 检查名词解释开始
                if (text.substring(i, i + 2) === '【*') {
                    const endIndex = findMatchingEnd(text, i, '【*', '*】');
                    if (endIndex !== -1) {
                        const innerText = text.substring(i + 2, endIndex);
                        const separatorIndex = innerText.indexOf('::');
                        
                        if (separatorIndex !== -1) {
                            const term = innerText.substring(0, separatorIndex);
                            const explanationText = innerText.substring(separatorIndex + 2);
                            
                            explanations.push({
                                start: i,
                                end: endIndex + 2,
                                term: term,
                                explanation: explanationText
                            });
                            
                            i = endIndex + 2;
                            continue;
                        }
                    }
                }
                i++;
            }
            
            return explanations;
        }
        
        // 找到匹配的结束标记
        function findMatchingEnd(text, startIndex, startMarker, endMarker) {
            let depth = 1;
            let i = startIndex + startMarker.length;
            
            while (i < text.length) {
                if (text.substring(i, i + startMarker.length) === startMarker) {
                    depth++;
                    i += startMarker.length;
                } else if (text.substring(i, i + endMarker.length) === endMarker) {
                    depth--;
                    if (depth === 0) {
                        return i;
                    }
                    i += endMarker.length;
                } else {
                    i++;
                }
            }
            
            return -1; // 没有找到匹配的结束标记
        }
        
        // 创建术语元素
        function createTermElement(term, explanation, setupElementEvents) {
            const termSpan = document.createElement('span');
            termSpan.className = 'term';
            
            // 解析术语中的HTML标签
            const tempElement = document.createElement('span');
            tempElement.innerHTML = term;
            while (tempElement.firstChild) {
                termSpan.appendChild(tempElement.firstChild);
            }
            
            // 添加点击事件 - 显示解释，兼容iOS
            setupElementEvents(termSpan, function(e) {
                // 如果这个名词解释在未揭示的挖空内，则先揭示挖空
                const parentBlank = this.closest('.blank');
                if (parentBlank && !parentBlank.classList.contains('revealed')) {
                    parentBlank.classList.add('revealed');
                    // 恢复嵌套名解的可见性
                    const nestedTerms = parentBlank.querySelectorAll('.term');
                    nestedTerms.forEach(term => {
                        term.style.visibility = 'visible';
                    });
                    // 阻止事件冒泡，防止触发其他事件
                    e.stopPropagation();
                    return;
                }
                
                // 获取术语在卡片中的位置百分比
                const card = document.querySelector('.card');
                const cardRect = card ? card.getBoundingClientRect() : null;
                const termRect = this.getBoundingClientRect();
                let positionYPercent = null;
                if (cardRect && termRect) {
                    // 计算术语中心相对于卡片顶部的百分比
                    const termCenterY = (termRect.top + termRect.bottom) / 2;
                    positionYPercent = ((termCenterY - cardRect.top) / cardRect.height) * 100;
                }
                
                // 显示解释框，传入位置百分比
                showExplanation(term, explanation, positionYPercent);
                
                // 阻止事件冒泡，防止触发其他事件
                e.stopPropagation();
            });
            
            return termSpan;
        }
        
        // 显示解释框
        function showExplanation(term, explanation, positionYPercent) {
            if (!explanationBox || !explanationTitle || !explanationContent) {
                console.error('Explanation module not initialized');
                return;
            }
            
            // 设置解释标题和内容，支持HTML
            explanationTitle.innerHTML = term;
            explanationContent.innerHTML = explanation;
            
            // 移除硬编码的深色样式，让CSS控制样式
            explanationBox.style.color = '';
            explanationBox.style.background = '';
            explanationBox.style.border = '';
            explanationTitle.style.color = '';
            explanationTitle.style.fontWeight = '';
            explanationTitle.style.textShadow = '';
            closeExplanation.style.color = '';
            closeExplanation.style.fontSize = '';
            closeExplanation.style.fontWeight = '';
            closeExplanation.style.textShadow = '';
            explanationContent.style.color = '';
            
            // 动态定位
            if (positionYPercent !== undefined && positionYPercent !== null) {
                const card = document.querySelector('.card');
                const cardRect = card ? card.getBoundingClientRect() : null;
                if (cardRect) {
                    // 先显示弹窗以获取其高度
                    explanationBox.classList.remove('hide');
                    explanationBox.classList.add('show');
                    
                    const boxHeight = explanationBox.offsetHeight || 200;
                    const winHeight = window.innerHeight;
                    
                    // 计算术语位置
                    let topPos = cardRect.top + (cardRect.height * positionYPercent / 100);
                    
                    // 检查是否超出窗口底部
                    const boxBottom = topPos + boxHeight;
                    if (boxBottom > winHeight - 20) {
                        // 超出底部，显示在术语上方
                        topPos = cardRect.top + (cardRect.height * positionYPercent / 100) - boxHeight - 10;
                        // 如果上方也不够，放到窗口顶部
                        if (topPos < 20) {
                            topPos = 20;
                        }
                    } else {
                        // 正常显示在术语下方，偏移约20px
                        topPos += 20;
                    }
                    
                    explanationBox.style.top = topPos + 'px';
                    // 保持水平居中
                    explanationBox.style.transform = 'translateX(-50%)';
                }
            } else {
                // 使用默认位置
                explanationBox.style.top = '20px';
                explanationBox.style.transform = 'translateX(-50%)';
            }
            
            explanationBox.classList.add('show');
        }
        
        // 隐藏解释框
        function hideExplanation() {
            if (explanationBox) {
                explanationBox.classList.remove('show');
            }
        }
        
        // 设置关闭按钮事件
        function setupCloseButton() {
            if (!closeExplanation) return;
            
            const handleCloseClick = function(event) {
                event.stopPropagation();
                if (event.touches && event.type.includes('touch')) {
                    event.preventDefault(); // 防止触摸事件触发两次
                }
                hideExplanation();
            };
            
            closeExplanation.addEventListener('click', handleCloseClick);
            closeExplanation.addEventListener('touchend', handleCloseClick);
        }
        
        // 设置文档点击事件
        function setupDocumentClick() {
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.term') && !e.target.closest('.explanation-box')) {
                    hideExplanation();
                }
            });
            // iOS 需要同时监听 touch 事件
            document.addEventListener('touchend', function(e) {
                if (!e.target.closest('.term') && !e.target.closest('.explanation-box')) {
                    hideExplanation();
                }
            });
        }
        
        // 公共API
        return {
            init: init,
            parseExplanations: parseExplanations,
            createTermElement: createTermElement,
            showExplanation: showExplanation,
            hideExplanation: hideExplanation
        };
    })();
    
    // 挖空模块封装
    const BlankModule = (function() {
        // 私有变量
        let blanksEnabled = true;

        // 初始化模块
        function init(enabled = true) {
            blanksEnabled = enabled;
        }

        // 解析文本中的挖空标记
        function parseBlanks(text) {
            const blanks = [];
            let i = 0;

            while (i < text.length) {
                // 检查挖空开始
                if (text.substring(i, i + 2) === '[[') {
                    const endIndex = findMatchingEnd(text, i, '[[', ']]');
                    if (endIndex !== -1) {
                        const innerText = text.substring(i + 2, endIndex);

                        blanks.push({
                            start: i,
                            end: endIndex + 2,
                            content: innerText
                        });

                        i = endIndex + 2;
                        continue;
                    }
                }
                i++;
            }

            return blanks;
        }

        // 找到匹配的结束标记
        function findMatchingEnd(text, startIndex, startMarker, endMarker) {
            let depth = 1;
            let i = startIndex + startMarker.length;

            while (i < text.length) {
                if (text.substring(i, i + startMarker.length) === startMarker) {
                    depth++;
                    i += startMarker.length;
                } else if (text.substring(i, i + endMarker.length) === endMarker) {
                    depth--;
                    if (depth === 0) {
                        return i;
                    }
                    i += endMarker.length;
                } else {
                    i++;
                }
            }

            return -1; // 没有找到匹配的结束标记
        }

        // 创建挖空元素
        function createBlankElement(content, setupElementEvents, renderNodes, fieldType = 'other') {
            const blankSpan = document.createElement('span');
            blankSpan.className = 'blank';

            // 解析挖空内容（可能包含名词解释）
            const innerNodes = renderNodes(content);

            // 根据挖空开关和字段类型决定初始状态
            if (!blanksEnabled || fieldType === 'notes') {
                blankSpan.classList.add('revealed');
            }

            blankSpan.appendChild(innerNodes);

            // 确保嵌套在未揭示挖空内的名解默认隐藏
            if (!blankSpan.classList.contains('revealed')) {
                const nestedTerms = blankSpan.querySelectorAll('.term');
                nestedTerms.forEach(term => {
                    term.style.visibility = 'hidden';
                });
            }

            // 添加点击事件 - 揭示挖空内容，兼容iOS
            setupElementEvents(blankSpan, function(e) {
                if (blanksEnabled && fieldType !== 'notes' && !this.classList.contains('revealed')) {
                    revealBlank(this);
                    // 阻止事件冒泡，防止触发名词解释的点击事件
                    e.stopPropagation();
                }
            });

            return blankSpan;
        }

        // 揭示挖空内容
        function revealBlank(blankElement) {
            if (!blankElement) return;

            blankElement.classList.add('revealed');
            // 恢复嵌套名解的可见性
            const nestedTerms = blankElement.querySelectorAll('.term');
            nestedTerms.forEach(term => {
                term.style.visibility = 'visible';
            });
        }
        
        // 检查挖空是否已揭示
        function isBlankRevealed(blankElement) {
            if (!blankElement) return false;
            return blankElement.classList.contains('revealed');
        }
        
        // 设置挖空开关状态
        function setBlanksEnabled(enabled) {
            blanksEnabled = enabled;
        }
        
        // 获取挖空开关状态
        function getBlanksEnabled() {
            return blanksEnabled;
        }
        
        // 公共API
        return {
            init: init,
            parseBlanks: parseBlanks,
            createBlankElement: createBlankElement,
            revealBlank: revealBlank,
            isBlankRevealed: isBlankRevealed,
            setBlanksEnabled: setBlanksEnabled,
            getBlanksEnabled: getBlanksEnabled
        };
    })();
    
    // 拼写模式模块封装
    const SpellModeModule = (function() {
        let isActive = false;
        let blanks = [];
        
        // 激活拼写模式：将挖空元素替换为输入框
        function activate() {
            if (isActive) return;
            isActive = true;
            blanks = [];
            
            // 在整个内容区域查找挖空元素（包括主字段、提要、知识解析等）
            var contentArea = document.querySelector('.content');
            if (!contentArea) return;
            
            var allBlanks = contentArea.querySelectorAll('.blank');
            
            allBlanks.forEach(function(blankEl) {
                // 跳过解释框内的挖空
                if (blankEl.closest('.explanation-box')) return;
                
                // 提取答案文本（去除解释标记，只取纯文本）
                const answer = extractPlainText(blankEl);
                if (!answer) return;
                
                // 创建输入容器
                var wrapper = document.createElement('span');
                wrapper.className = 'spell-blank-wrapper';
                
                // 创建输入框
                var input = document.createElement('input');
                input.type = 'text';
                input.className = 'spell-blank-input';
                input.dataset.answer = answer;
                input.dataset.index = blanks.length;
                input.autocomplete = 'off';
                input.spellcheck = false;
                input.setAttribute('autocorrect', 'off');
                input.setAttribute('autocapitalize', 'off');
                
                // 测量答案文字实际宽度，作为最小宽度
                var measureSpan = document.createElement('span');
                measureSpan.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font-size:inherit;font-family:inherit;font-weight:inherit;';
                measureSpan.textContent = answer;
                document.body.appendChild(measureSpan);
                input.style.width = (measureSpan.offsetWidth + 8) + 'px';
                document.body.removeChild(measureSpan);
                
                wrapper.appendChild(input);
                
                // 替换挖空元素
                blankEl.parentNode.replaceChild(wrapper, blankEl);
                
                blanks.push({ element: wrapper, answer: answer, input: input });
                
                // 绑定事件
                input.addEventListener('input', handleInput);
                input.addEventListener('keydown', handleKeydown);
            });
            
            // 聚焦第一个输入框
            if (blanks.length > 0) {
                setTimeout(function() { blanks[0].input.focus(); }, 50);
            }
        }
        
        // 提取元素的纯文本内容
        function extractPlainText(el) {
            var text = el.textContent || '';
            // 去除名词解释标记的残留文本（如术语::解释 格式只取术语部分）
            text = text.replace(/\[\[|\]\]/g, '');
            return text.trim();
        }
        
        // 停用拼写模式：刷新页面恢复原始状态
        function deactivate() {
            if (!isActive) return;
            isActive = false;
            location.reload();
        }
        
        // 处理输入事件
        function handleInput(e) {
            var input = e.target;
            var answer = input.dataset.answer;
            var userValue = input.value;
            
            // 检查是否完全正确
            if (userValue.toLowerCase() === answer.toLowerCase()) {
                input.classList.add('spell-correct');
                input.classList.remove('spell-incorrect', 'spell-partial');
                input.readOnly = true;
                
                // 修正大小写为正确答案
                input.value = answer;
                
                // 移动到下一个空
                var idx = parseInt(input.dataset.index);
                moveToNextBlank(idx);
            } else if (userValue.length > 0) {
                // 实时比较，设置颜色
                var isCorrectSoFar = answer.toLowerCase().startsWith(userValue.toLowerCase());
                input.classList.toggle('spell-incorrect', !isCorrectSoFar);
                input.classList.toggle('spell-partial', isCorrectSoFar);
                input.classList.remove('spell-correct');
            } else {
                input.classList.remove('spell-correct', 'spell-incorrect', 'spell-partial');
            }
        }
        
        // 处理键盘事件
        function handleKeydown(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                var idx = parseInt(e.target.dataset.index);
                moveToNextBlank(idx);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                revealCurrentBlank(e.target);
            }
            // 不阻止 Delete、Backspace 等编辑键的默认行为
        }
        
        // 移动到下一个未完成的输入框
        function moveToNextBlank(currentIdx) {
            // 先找后面的
            for (var i = currentIdx + 1; i < blanks.length; i++) {
                if (!blanks[i].input.readOnly) {
                    blanks[i].input.focus();
                    return;
                }
            }
            // 再找前面的（循环）
            for (var i = 0; i <= currentIdx; i++) {
                if (!blanks[i].input.readOnly) {
                    blanks[i].input.focus();
                    return;
                }
            }
            // 全部完成
            showAllComplete();
        }
        
        // 显示答案（Enter键）
        function revealCurrentBlank(input) {
            if (input.readOnly) return;
            
            var answer = input.dataset.answer;
            input.value = answer;
            input.classList.add('spell-correct', 'spell-revealed');
            input.readOnly = true;
            
            moveToNextBlank(parseInt(input.dataset.index));
        }
        
        // 全部完成提示
        function showAllComplete() {
            var allCorrect = blanks.every(function(b) { return b.input.readOnly; });
            if (allCorrect && blanks.length > 0) {
                // 可以添加一个完成提示
            }
        }
        
        // HTML 转义
        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function getIsActive() { return isActive; }
        
        return {
            activate: activate,
            deactivate: deactivate,
            getIsActive: getIsActive
        };
    })();
    
    // 辅助函数：获取配置
    function getConfig(name, defaultValue) {
        // 1. 优先从 localStorage 读取（用户保存的设置）
        const storedValue = window.ankiStorage.getConfig(name);
        if (storedValue !== undefined) {
            if (typeof defaultValue === 'boolean') {
                if (storedValue === 'true') return true;
                if (storedValue === 'false') return false;
            }
            if (typeof defaultValue === 'number' && !isNaN(parseFloat(storedValue))) {
                return parseFloat(storedValue);
            }
            return storedValue;
        }

        // 2. 其次从 HTML 注释读取（模板中设置的默认值）
        const regex = new RegExp(`<!-- config:${name}=([^\\s]+) -->`);
        const configSource = document.documentElement.innerHTML || '';
        const match = configSource.match(regex);
        if (match && match[1]) {
            let value = match[1];
            if (typeof defaultValue === 'boolean') {
                if (value === 'true') return true;
                if (value === 'false') return false;
            }
            if (typeof defaultValue === 'number' && !isNaN(parseFloat(value))) {
                return parseFloat(value);
            }
            return value;
        }

        // 3. 最后使用 JS 代码中的默认值
        return defaultValue;
    }
    
    // 持久化模板默认值到localStorage（首次加载时初始化）
    function persistTemplateDefaults() {
        const configKeys = ['theme', 'fontSize', 'otherContentMode', 'studyMode'];
        const defaults = {
            theme: 'system',
            fontSize: 16,
            otherContentMode: 'popup',
            studyMode: 'blank'
        };
        
        configKeys.forEach(key => {
            const existingValue = window.ankiStorage.getConfig(key);
            
            // 如果localStorage中还没有这个值
            if (existingValue === undefined) {
                // 优先从HTML注释读取默认值
                const regex = new RegExp(`<!-- config:${key}=([^\\s]+) -->`);
                const configSource = document.documentElement.innerHTML || '';
                const match = configSource.match(regex);
                
                let defaultValue;
                if (match && match[1]) {
                    // 从HTML注释读取
                    const strValue = match[1];
                    if (strValue === 'true') defaultValue = true;
                    else if (strValue === 'false') defaultValue = false;
                    else if (!isNaN(parseFloat(strValue))) defaultValue = parseFloat(strValue);
                    else defaultValue = strValue;
                } else {
                    // 使用JS代码中的默认值
                    defaultValue = defaults[key];
                }
                
                window.ankiStorage.setConfig(key, defaultValue);
            }
        });
    }
    
    // 辅助函数：找到匹配的结束标记
    function findMatchingEnd(text, startIndex, startMarker, endMarker) {
        let depth = 1;
        let i = startIndex + startMarker.length;
        
        while (i < text.length) {
            if (text.substring(i, i + startMarker.length) === startMarker) {
                depth++;
                i += startMarker.length;
            } else if (text.substring(i, i + endMarker.length) === endMarker) {
                depth--;
                if (depth === 0) {
                    return i;
                }
                i += endMarker.length;
            } else {
                i++;
            }
        }
        
        return -1; // 没有找到匹配的结束标记
    }
    
    // 解析器 - 支持嵌套标记
    function parseText(text) {
        const nodes = [];
        let i = 0;
        
        while (i < text.length) {
            // 检查名词解释开始
            if (text.substring(i, i + 2) === '【*') {
                const endIndex = findMatchingEnd(text, i, '【*', '*】');
                if (endIndex !== -1) {
                    const innerText = text.substring(i + 2, endIndex);
                    const separatorIndex = innerText.indexOf('::');
                    
                    if (separatorIndex !== -1) {
                        const term = innerText.substring(0, separatorIndex);
                        const explanationText = innerText.substring(separatorIndex + 2);
                        
                        nodes.push({
                            type: 'explanation',
                            term: term,
                            explanation: explanationText
                        });
                        
                        i = endIndex + 2;
                        continue;
                    }
                }
                // 未找到闭合标记，作为普通文本处理
            }
            
            // 检查挖空开始
            if (text.substring(i, i + 2) === '[[') {
                const endIndex = findMatchingEnd(text, i, '[[', ']]');
                if (endIndex !== -1) {
                    const innerText = text.substring(i + 2, endIndex);
                    
                    nodes.push({
                        type: 'blank',
                        content: innerText
                    });
                    
                    i = endIndex + 2;
                    continue;
                }
                // 未找到闭合标记，作为普通文本处理
            }
            
            // 普通文本
            let j = i;
            while (j < text.length) {
                if (text.substring(j, j + 2) === '【*' || text.substring(j, j + 2) === '[[') {
                    break;
                }
                j++;
            }
            
            if (j > i) {
                nodes.push({
                    type: 'text',
                    content: text.substring(i, j)
                });
            }
            
            // 如果没有找到任何标记，移动到下一个字符
            if (j === i) {
                j = i + 1;
            }
            
            i = j;
        }
        
        return nodes;
    }
    
    // 将解析后的节点转换为DOM元素
    function renderNodes(nodes, fieldType = 'other') {
        const fragment = document.createDocumentFragment();

        // 添加双事件处理：click + touch (iOS兼容)
        const setupElementEvents = (element, handler) => {
            const wrappedHandler = function(e) {
                // 防止触摸事件触发两次
                if (e.touches && e.type.includes('touch')) {
                    e.preventDefault();
                }
                handler.call(this, e);
            };

            // 添加iOS兼容的触摸事件
            element.addEventListener('click', wrappedHandler);
            element.addEventListener('touchend', wrappedHandler);
        };

        nodes.forEach(node => {
            if (node.type === 'text') {
                // 创建临时元素来解析HTML标签
                const tempElement = document.createElement('span');
                tempElement.innerHTML = node.content;
                // 将临时元素的所有子节点添加到fragment中
                while (tempElement.firstChild) {
                    fragment.appendChild(tempElement.firstChild);
                }
            } else if (node.type === 'blank') {
                // 使用BlankModule创建挖空元素
                const blankSpan = BlankModule.createBlankElement(node.content, setupElementEvents, function(content) {
                    const innerNodes = parseText(content);
                    return renderNodes(innerNodes, fieldType);
                }, fieldType);

                fragment.appendChild(blankSpan);
            } else if (node.type === 'explanation') {
                // 使用ExplanationModule创建术语元素
                const termSpan = ExplanationModule.createTermElement(node.term, node.explanation, setupElementEvents);
                fragment.appendChild(termSpan);
            }
        });

        return fragment;
    }
    
    // DOM感知的文本节点标记处理（不破坏HTML结构）
    function processTextMarkers(rootElement, fieldType) {
        var MARKERS = ['[[', '【*'];
        var MAX_ITERATIONS = 500;
        var iterations = 0;

        var iterator = document.createTreeWalker(rootElement, NodeFilter.SHOW_TEXT, null, false);
        var textNode = iterator.nextNode();

        while (textNode && iterations < MAX_ITERATIONS) {
            iterations++;
            try {
                // 安全检查：跳过已处理元素内的文本节点
                var parent = textNode.parentNode;
                if (!parent) { textNode = iterator.nextNode(); continue; }
                var parentEl = parent.nodeType === 1 ? parent : parent.parentElement;
                if (parentEl && (parentEl.closest('.blank') || parentEl.closest('.term'))) {
                    textNode = iterator.nextNode();
                    continue;
                }

                var content = textNode.nodeValue;
                if (!content) { textNode = iterator.nextNode(); continue; }

                var hasMarker = false;
                for (var m = 0; m < MARKERS.length; m++) {
                    if (content.indexOf(MARKERS[m]) !== -1) { hasMarker = true; break; }
                }

                if (!hasMarker) { textNode = iterator.nextNode(); continue; }

                var parsedNodes = parseText(content);
                if (!parsedNodes || parsedNodes.length === 0) { textNode = iterator.nextNode(); continue; }
                // 如果解析结果只有纯文本，无需替换
                if (parsedNodes.length === 1 && parsedNodes[0].type === 'text') { textNode = iterator.nextNode(); continue; }

                var replacement = renderNodes(parsedNodes, fieldType);
                var nextSibling = textNode.nextSibling;
                parent.removeChild(textNode);
                if (nextSibling) {
                    parent.insertBefore(replacement, nextSibling);
                } else {
                    parent.appendChild(replacement);
                }

                // DOM结构已改变，重新遍历
                iterator = document.createTreeWalker(rootElement, NodeFilter.SHOW_TEXT, null, false);
                textNode = iterator.nextNode();
            } catch (e) {
                console.warn('processTextMarkers error:', e);
                textNode = iterator.nextNode();
            }
        }
    }

    // 处理文本内容，支持挖空和名词解释（DOM感知，不破坏HTML结构如表格）
    function processFieldContent(element) {
        if (!element) return;

        var originalContent = element.innerHTML;

        // 快速检查是否包含标记
        var hasMarkers = originalContent.indexOf('[[') !== -1 || originalContent.indexOf('【*') !== -1;

        if (hasMarkers) {
            // 有标记：用DOM感知方式处理（先解析HTML，再在文本节点内替换标记）
            try {
                processTextMarkers(element, 'other');
            } catch (e) {
                console.warn('Marker processing error, using raw content:', e);
            }
        }
        // 无标记：innerHTML已正确渲染，无需处理
    }
    
    // 字段模块封装
    const FieldModule = (function() {
        function createFieldContainer(fieldId, fieldName, content, fieldType = 'analysis') {
            const container = document.createElement('div');
            container.className = 'trapezoid-container';
            container.id = fieldId + '-container';

            // 根据字段类型添加不同的类名
            if (fieldType === 'analysis') {
                container.classList.add('analysis-field');
            } else if (fieldType === 'other') {
                container.classList.add('other-field');
            }

            const trapezoid = document.createElement('div');
            trapezoid.className = 'trapezoid';
            trapezoid.innerHTML = `<span>${fieldName}</span>`;

            const rectangle = document.createElement('div');
            rectangle.className = 'rectangle';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'field-content';
            contentDiv.id = 'front-' + fieldId;

            contentDiv.innerHTML = content;
            // DOM感知处理标记（不破坏HTML结构如表格）
            var hasSpecialMarkers = content.indexOf('[[') !== -1 || content.indexOf('【*') !== -1;
            if (hasSpecialMarkers) {
                processTextMarkers(contentDiv, 'analysis');
            }

            rectangle.appendChild(contentDiv);
            container.appendChild(trapezoid);
            container.appendChild(rectangle);
            trapezoid.style.marginBottom = '-1px';

            return container;
        }

        function addField(fieldId, fieldName, content, parentElement, fieldType = 'analysis') {
            if (!content || content.trim() === '') {
                return null;
            }
            const container = createFieldContainer(fieldId, fieldName, content, fieldType);
            parentElement.appendChild(container);
            return container;
        }

        return {
            createFieldContainer: createFieldContainer,
            addField: addField
        };
    })();

    // 知识解析模块封装
    const KnowledgeAnalysisModule = (function() {
        function parseKnowledgeAnalysis(content) {
            if (!content || content.trim() === '') {
                return [];
            }

            const items = content.split('<br>###');
            const fields = [];

            items.forEach((item, index) => {
                if (item.trim() === '') return;

                const parts = item.split('::');
                if (parts.length >= 2) {
                    const fieldName = parts[0].trim();
                    const fieldContent = parts.slice(1).join('::').trim();

                    fields.push({
                        id: 'analysis-' + index + '-' + fieldName.toLowerCase().replace(/\s+/g, '-'),
                        name: fieldName,
                        content: fieldContent
                    });
                }
            });

            return fields;
        }

        function renderKnowledgeAnalysis(content, parentElement, fieldType = 'analysis') {
            const fields = parseKnowledgeAnalysis(content);

            fields.forEach(field => {
                FieldModule.addField(field.id, field.name, field.content, parentElement, fieldType);
            });
        }

        return {
            parseKnowledgeAnalysis: parseKnowledgeAnalysis,
            renderKnowledgeAnalysis: renderKnowledgeAnalysis
        };
    })();

    // 简化的设置模块 - 仅用于应用配置（不显示UI）
    const SettingsModule = {
        applySettings: function() {
            const fontSize = getConfig('fontSize', 16);
            
            // 通过设置CSS变量来统一控制字体大小
            document.documentElement.style.setProperty('--base-font-size', fontSize + 'px');
            
            applyTheme();
        },
        
        applyTheme: function() {
            const theme = getConfig('theme', 'system');
            const html = document.documentElement;
            
            html.classList.remove('theme-blue', 'theme-pink', 'theme-mint', 'theme-dark', 'theme-eye-care');
            
            if (theme === 'system') {
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                html.classList.add(prefersDark ? 'theme-dark' : 'theme-blue');
                
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                    const currentTheme = getConfig('theme', 'system');
                    if (currentTheme === 'system') {
                        html.classList.remove('theme-blue', 'theme-dark');
                        html.classList.add(e.matches ? 'theme-dark' : 'theme-blue');
                    }
                });
            } else if (theme === 'blue') {
                html.classList.add('theme-blue');
            } else if (theme === 'pink') {
                html.classList.add('theme-pink');
            } else if (theme === 'mint') {
                html.classList.add('theme-mint');
            } else if (theme === 'dark') {
                html.classList.add('theme-dark');
            } else if (theme === 'eye-care') {
                html.classList.add('theme-eye-care');
            }
        }
    };
    
    function applyTheme() {
        SettingsModule.applyTheme();
    }
    
    // 初始化 - 不使用DOMContentLoaded，直接执行
    // 自动激活拼写模式（根据配置）
    function autoActivateSpellMode() {
        var savedMode = getConfig('studyMode', 'blank');
        
        if (savedMode === 'spell') {
            SpellModeModule.activate();
        } else if (savedMode === 'recite') {
            // 背诵模式：揭示所有挖空
            var contentArea = document.querySelector('.content');
            if (contentArea) {
                var allBlanks = contentArea.querySelectorAll('.blank:not(.revealed)');
                allBlanks.forEach(function(blankEl) {
                    blankEl.classList.add('revealed');
                    var nestedTerms = blankEl.querySelectorAll('.term');
                    nestedTerms.forEach(function(term) {
                        term.style.visibility = 'visible';
                    });
                });
            }
        }
    }
    
    function init() {
        // 初始化授权码显示
        const authCodeDisplay = document.getElementById('auth-code-display');
        if (authCodeDisplay) {
            authCodeDisplay.textContent = generateAuthCode();
        }

        // 设置卡片最小高度为窗口高度
        const card = document.querySelector('.card');
        if (card) {
            card.style.minHeight = window.innerHeight + 'px';
        }
        
        // 监听窗口大小变化
        window.addEventListener('resize', function() {
            if (card) {
                card.style.minHeight = window.innerHeight + 'px';
            }
        });
        
        // 持久化模板默认值到localStorage（如果尚未设置）
        persistTemplateDefaults();
        
        // 隐藏空的章节
        hideEmptyChapter();
        
        // 初始化编号显示（已移除）
        // initNumberDisplay();

        // 初始化等级按钮
        ExplanationModule.init(explanationBox, explanationTitle, explanationContent, closeExplanation);
        
        // 初始化BlankModule（背诵模式下禁用挖空）
        const studyMode = getConfig('studyMode', 'blank');
        const blanksEnabled = studyMode !== 'recite';
        BlankModule.init(blanksEnabled);
        
        // 检查文本对齐
        checkTextAlignment(document.getElementById('front-original-text'));
        checkTextAlignment(document.getElementById('front-summary'));
        
        // 隐藏空字段
        hideEmptyFields();
        
        // 处理知识解析
        processKnowledgeAnalysis();
    }
    
    // 处理知识解析字段
    function processKnowledgeAnalysis() {
        const analysisContainer = document.getElementById('front-analysis-container');
        if (!analysisContainer) return;
        
        const analysisElement = document.getElementById('front-knowledge-analysis');
        if (!analysisElement) return;
        
        const content = analysisElement.innerHTML.trim();
        if (content === '') {
            analysisContainer.style.display = 'none';
            return;
        }
        
        const parentElement = document.querySelector('.content');
        if (!parentElement) return;
        
        analysisContainer.remove();

        KnowledgeAnalysisModule.renderKnowledgeAnalysis(content, parentElement, 'analysis');
    }
    
    // 页面加载时立即执行初始化
    init();
    
    // 处理字段内容
    processFieldContent(document.getElementById('front-original-text'));
    processFieldContent(document.getElementById('front-summary'));
    
    // 自动激活拼写模式（必须在 processFieldContent 之后）
    autoActivateSpellMode();

    // 处理用户笔记
    processNotes();

    // 隐藏空字段
    function hideEmptyFields() {
        const summaryContainer = document.getElementById('front-summary-container');
        const summaryContent = document.getElementById('front-summary');

        if (summaryContent && summaryContent.textContent.trim() === '') {
            summaryContainer.style.display = 'none';
        }
    }

    // 处理用户笔记字段
    function processNotes() {
        const notesElement = document.getElementById('front-notes');
        if (!notesElement) return;

        const originalHtml = notesElement.innerHTML;
        const content = notesElement.textContent.trim();
        const hasHtmlTags = /<[^>]+>/i.test(originalHtml);

        if (!hasHtmlTags && content === '') {
            notesElement.innerHTML = '<span class="notes-placeholder">使用图片或文字记录笔记</span>';
        }
    }

    // 切换笔记收起/展开
    function toggleNotes(side) {
        const containerId = side === 'back' ? 'notes-container' : 'front-notes-container';
        const container = document.getElementById(containerId);
        if (container) {
            container.classList.toggle('collapsed');
        }
    }

    // 确保toggleNotes暴露到全局
    window.toggleNotes = toggleNotes;
    
    // 暴露到全局
    window.toggleNotes = toggleNotes;

    // 检查文本对齐
    function checkTextAlignment(textElement) {
        if (!textElement) return;
        
        const lineHeight = parseFloat(getComputedStyle(textElement).lineHeight);
        const height = textElement.offsetHeight;
        
        // 如果高度超过一行的高度，则为多行（降低阈值到1.2倍）
        if (height > lineHeight * 1.2) {
            textElement.classList.add('multi-line');
        } else {
            textElement.classList.remove('multi-line');
        }
    }
    
    // 立即执行初始化
    init();
    
    // 应用当前设置（从localStorage读取配置）
    SettingsModule.applySettings();
})();

// 复制微信号到剪贴板
window.copyWechatToClipboard = function(event) {
    // 如果提供了事件对象，处理事件传播和默认行为
    if (event) {
        event.stopPropagation();
        if (event.touches && event.type.includes('touch')) {
            event.preventDefault(); // 防止触摸事件触发两次
        }
    }
    
    const wechatNumber = 'kikkua2649';
    
    // 方法1: 使用现代 Clipboard API
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(wechatNumber).then(function() {
            showCopySuccess();
        }).catch(function(err) {
            console.error('Clipboard API failed:', err);
            fallbackCopy(wechatNumber);
        });
    } else {
        // 方法2: 回退到传统方法
        fallbackCopy(wechatNumber);
    }
};

// 为复制按钮添加触摸事件支持
function setupCopyButtonEvents() {
    const copyButtons = document.querySelectorAll('[onclick*="copyWechatToClipboard"]');
    copyButtons.forEach(button => {
        // 移除原始的onclick属性
        button.removeAttribute('onclick');
        
        // 添加标准化的事件处理
        const handleCopyClick = function(event) {
            event.stopPropagation();
            if (event.touches && event.type.includes('touch')) {
                event.preventDefault(); // 防止触摸事件触发两次
            }
            window.copyWechatToClipboard(event);
        };
        
        button.addEventListener('click', handleCopyClick);
        button.addEventListener('touchend', handleCopyClick);
    });
}

// 当DOM内容加载完成后设置复制按钮事件
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupCopyButtonEvents);
} else {
    setupCopyButtonEvents();
}

function fallbackCopy(text) {
    // 创建临时文本区域
    const textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.left = '-999999px';
    textArea.style.top = '-999999px';
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    
    try {
        const successful = document.execCommand('copy');
        if (successful) {
            showCopySuccess();
        } else {
            showCopyError();
        }
    } catch (err) {
        console.error('Fallback copy failed:', err);
        showCopyError();
    }
    
    document.body.removeChild(textArea);
}

function showCopySuccess() {
    if (window.anki && window.anki.showToast) {
        window.anki.showToast('微信号已复制到剪贴板');
    } else {
        // 创建临时提示
        const toast = document.createElement('div');
        toast.style.cssText = `
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 10000;
            pointer-events: none;
        `;
        toast.textContent = '微信号已复制';
        document.body.appendChild(toast);
        
        setTimeout(() => {
            if (document.body.contains(toast)) {
                document.body.removeChild(toast);
            }
        }, 2000);
    }
}

function showCopyError() {
    if (window.anki && window.anki.showToast) {
        window.anki.showToast('复制失败，请手动复制');
    } else {
        alert('复制失败，请手动复制微信号：kikkua2649');
    }
}

// 根据等级数字添加对应CSS类
function applyLevelStyling() {
    const settingsButton = document.getElementById('anki-settings-button');
    if (settingsButton) {
        const levelText = settingsButton.textContent.trim();
        settingsButton.classList.remove('level-1', 'level-2', 'level-3', 'settings-icon');
        
        if (levelText === '1') {
            settingsButton.classList.add('level-1');
        } else if (levelText === '2') {
            settingsButton.classList.add('level-2');
        } else if (levelText === '3') {
            settingsButton.classList.add('level-3');
        } else {
            settingsButton.style.display = 'none';
        }
    }
}

// 当DOM内容加载完成后应用等级样式
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', applyLevelStyling);
} else {
    applyLevelStyling();
}
