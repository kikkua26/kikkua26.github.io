<!--
    ===== 模板默认配置 =====
    用户可以修改下面的注释来设置默认值（修改后需要重新导入模板）
    
    config:studyMode=blank       学习模式: blank=挖空模式, spell=拼写模式, recite=背诵模式
    config:theme=system           主题: system=跟随系统, blue=简约蓝, pink=果粉色, mint=果冻绿, dark=深色, eye-care=护眼
    config:fontSize=16            字体大小: 12-24
    config:otherContentMode=popup 知识扩展: popup=按钮弹窗, inline=页面显示
-->
<!-- config:studyMode=blank -->
<!-- config:theme=system -->
<!-- config:fontSize=16 -->
<!-- config:otherContentMode=popup -->
<!-- 正面模板 - 只显示主字段和提要 -->
<div class="card-header">
    <div class="chapter" id="chapter-display">{{章节}}</div>
    <div id="anki-settings-button" class="settings-button" title="设置">{{等级}}</div>
</div>

<!-- 授权提示工具提示 -->
<div class="footer-auth-tooltip" id="footer-auth-tooltip">
    <strong>版权声明</strong>
    本牌组模板受知识产权法保护。未经授权的复制、分发或修改将构成侵权行为。创作不易，感谢支持！
</div>

<!-- 名词解释框 -->
<div id="explanationBox" class="explanation-box">
    <div class="explanation-header">
        <span class="explanation-title" id="explanationTitle">术语</span>
        <button class="close-btn" id="closeExplanation">&times;</button>
    </div>
    <div class="explanation-content" id="explanationContent">
        <!-- 解释内容将显示在这里 -->
    </div>
</div>

<div class="content">
    <!-- 主字段 -->
            <div class="original-field">
                <p class="original-text">
                    <span id="front-original-text">{{主字段}}</span>
                </p>
            </div>
    
    <!-- 提要插槽 - 紧贴主字段下方 -->
    <div class="summary-container" id="front-summary-container">
        <div class="summary-label">提要</div>
        <div class="summary-content" id="front-summary">{{提要}}</div>
    </div>
    
    <!-- 用户笔记字段 -->
    <div class="notes-container collapsed" id="front-notes-container">
        <div class="notes-header" onclick="toggleNotes('front')">
            <div class="notes-label">笔记</div>
            <span class="notes-toggle">▼</span>
        </div>
        <div class="notes-content" id="front-notes">{{用户笔记}}</div>
    </div>
    
    <!-- 知识解析插槽 - 紧贴提要下方 -->
    <div class="trapezoid-container" id="front-analysis-container" style="display: none;">
        <div class="trapezoid">
            <span>知识解析</span>
        </div>
        <div class="rectangle">
            <div class="field-content" id="front-knowledge-analysis">
                {{知识解析}}
            </div>
        </div>
    </div>
</div>
