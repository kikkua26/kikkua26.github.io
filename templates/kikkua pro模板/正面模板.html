window.ankiStorage = (function() {
  const prefix = 'anki_sel_'; 
  const configPrefix = 'anki_cfg_'; 
  console.log('【调试】front.html window.ankiStorage 定义');
  return {
    set: function(key, data) {
      const safeKey = prefix + btoa(encodeURIComponent(key)).slice(0, 50);
      try {
        localStorage.setItem(safeKey, JSON.stringify(data));
        console.log('【调试】front.html set localStorage:', safeKey, data);
      } catch(e) {
        console.warn('localStorage setItem failed, falling back to window object for key:', safeKey, e);
        window[safeKey] = data;
      }
    },
    get: function(key) {
      const safeKey = prefix + btoa(encodeURIComponent(key)).slice(0, 50);
      try {
        const data = localStorage.getItem(safeKey);
        console.log('【调试】front.html get localStorage:', safeKey, data);
        return data ? JSON.parse(data) : null;
      } catch(e) {
        console.warn('localStorage getItem failed, falling back to window object for key:', safeKey, e);
        return window[safeKey] || null;
      }
    },
    clear: function(key) {
      const safeKey = prefix + btoa(encodeURIComponent(key)).slice(0, 50);
      try {
        localStorage.removeItem(safeKey);
        console.log('【调试】front.html clear localStorage:', safeKey);
      } catch(e) {
        console.warn('localStorage removeItem failed, attempting to delete from window object for key:', safeKey, e);
        delete window[safeKey];
      }
    },
    setConfig: function(configKey, value) {
      try {
        localStorage.setItem(configPrefix + configKey, JSON.stringify(value));
      } catch (e) {
        console.error('Error saving config to localStorage:', configKey, e);
      }
    },
    getConfig: function(configKey) {
      try {
        const value = localStorage.getItem(configPrefix + configKey);
        return value !== null ? JSON.parse(value) : undefined; 
      } catch (e) {
        console.error('Error reading config from localStorage:', configKey, e);
        return undefined;
      }
    }
  };
})();
(function() {

  function isIOS() {

  function getConfig(name, defaultValue) {
    const storedValue = window.ankiStorage.getConfig(name);
    if (storedValue !== undefined) {
      if (typeof defaultValue === 'boolean') {
        if (storedValue === 'true') return true;
        if (storedValue === 'false') return false;
      }
      if (typeof defaultValue === 'number' && !isNaN(parseFloat(storedValue))) {
        return parseFloat(storedValue);
      }
      return storedValue;
    }
    const regex = new RegExp(`<!-- config:${name}=([\\w.-]+) -->`); 
    const match = document.documentElement.innerHTML.match(regex);
    if (match) {
      const value = match[1];
      if (value === 'true') return true;
      if (value === 'false') return false;
      if (typeof defaultValue === 'number' && !isNaN(parseFloat(value))) {
        return parseFloat(value);
      }
      return value;
    }
    return defaultValue;
  }
  function addFlipHintIfNeeded(anchorElement) {
    const showFlipHintConfig = true; 
    if (!showFlipHintConfig || !anchorElement || !anchorElement.parentNode) return;

  }
  function escapeHTMLTextSegment(str) {
    if (typeof str !== 'string') return '';
    return str.replace(/&/g, '&amp;');
  }
  function generateInitialClozeHTML(text) {
    let output = "";
    let i = 0;
    while (i < text.length) {
      let openBracket = text.indexOf('[[', i);
      if (openBracket === -1) {
        output += escapeHTMLTextSegment(text.substring(i));
        break;
      }
      output += escapeHTMLTextSegment(text.substring(i, openBracket));
      let balance = 0;
      let startContent = openBracket + 2;
      let endContent = -1;
      let k = startContent;
      for (; k < text.length; k++) {
        if (text.substring(k, k + 2) === '[[') {
          balance++;
          k++; 
        } else if (text.substring(k, k + 2) === ']]') {
          if (balance === 0) {
            endContent = k;
            break;
          }
          balance--;
          k++; 
        }
      }
      if (endContent === -1) { 
        output += escapeHTMLTextSegment(text.substring(openBracket));
        break;
      }
      const clozeContentForAttr = text.substring(startContent, endContent);
      const escapedClozeContentForAttr = clozeContentForAttr
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      let dynamicPlaceholderText = '';
      const hiddenContentLength = clozeContentForAttr.trim().length;
      const minPlaceholderRepetitions = 3;
      const maxPlaceholderRepetitions = 12;
      const charsPerRepetitionUnit = 4;
      let repetitions = Math.floor(hiddenContentLength / charsPerRepetitionUnit);
      repetitions = Math.max(minPlaceholderRepetitions, repetitions);
      repetitions = Math.min(maxPlaceholderRepetitions, repetitions);
      const placeholderChar = '·';
      dynamicPlaceholderText = placeholderChar.repeat(repetitions);
      output += `<span class="cloze-block" data-original-content="${escapedClozeContentForAttr}" data-placeholder-text="${dynamicPlaceholderText}">${dynamicPlaceholderText}</span>`;
      i = endContent + 2;
    }
    return output;
  }
  function revealThisCloze(event) {
    event.stopPropagation();
    const block = this;
    let tempElem = document.createElement('textarea');
    tempElem.innerHTML = block.getAttribute('data-original-content');
    const rawOriginalContent = tempElem.value;
    block.innerHTML = generateInitialClozeHTML(rawOriginalContent); 
    setupClozeInteractions(block); 
    block.classList.remove('cloze-block');
    block.classList.add('revealed');    
    block.style.cursor = 'pointer'; 
    block.onclick = hideThisCloze; 
  }
  function hideThisCloze(event) {
    event.stopPropagation();
    const block = this;
    const placeholderText = block.getAttribute('data-placeholder-text');
    block.innerHTML = placeholderText;
    block.classList.remove('revealed');
    block.classList.add('cloze-block');
    block.style.cursor = 'pointer'; 
    block.onclick = revealThisCloze; 
  }
  function setupClozeInteractions(container) {
    const newClozeBlocks = container.querySelectorAll('.cloze-block:not(.cloze-handler-attached)');
    newClozeBlocks.forEach(block => {
      block.classList.add('cloze-handler-attached'); 
      block.onclick = revealThisCloze;
    });
  }
  const optionsArray = optionsString.split('||').map(option => option.trim()).filter(option => option);
  const choiceAnswerDefined = choiceAnswerString.length > 0;
  const isClozeMode = clozeTextContent.length > 0;
  const isClozeChoiceMode = (() => {
    const trimmedQuestion = questionContent.trim();
    const startsWithDoubleOrTripleDollar = trimmedQuestion.startsWith('$$') || trimmedQuestion.startsWith('$$$');
    if (!startsWithDoubleOrTripleDollar) return false;
    if (!optionsString.trim() || !choiceAnswerString.trim()) return false;
    if (!trimmedQuestion.includes('##')) return false;
    return true;
  })();
  const isQAMode = !isClozeMode && !isClozeChoiceMode && questionContent.length > 0 && answerTextContent.length > 0 && (optionsArray.length === 0 || !choiceAnswerDefined);
const isChoiceMode = !isClozeMode && !isClozeChoiceMode && !isQAMode && questionContent.length > 0 && optionsArray.length > 0 && choiceAnswerDefined;
  const isImageClozeMode = (() => {
    try {
      const masks = JSON.parse(questionContent);
      if (Array.isArray(masks) && masks.length > 0) {

        return firstMask.hasOwnProperty('x') && firstMask.hasOwnProperty('y') && 
               firstMask.hasOwnProperty('w') && firstMask.hasOwnProperty('h');

    } catch(e) {
    }
    return false;
  })();
  const SettingsPanelModule = (function() {
    let isOpen = false;
    const configOptions = [
      { key: 'themeMode', label: '主题模式', type: 'select', options: [
          {value: 'light', text: '明亮'}, {value: 'dark', text: '暗黑'},
          {value: 'eyeCare', text: '护眼'}, {value: 'system', text: '跟随系统'}
        ], default: 'system' },
      { key: 'cardWidthPercent', label: '卡片宽度百分比', type: 'number', default: 55, min: 50, max: 100, step: 5 },
      { key: 'shuffleOptions', label: '随机打乱选项', type: 'toggle', default: true },
      { key: 'showOptionLabels', label: '显示选项标签 (正面)', type: 'toggle', default: true },
      { key: 'showTimer', label: '显示倒计时', type: 'toggle', default: true },
      { key: 'timerDuration', label: '倒计时长 (秒)', type: 'number', default: 15, min: 5, max: 120, step: 1 },
      { key: 'showSessionStats', label: '显示做题统计 (选择题背面)', type: 'toggle', default: true },
    ];
    function createSettingItem(config) {
      const itemDiv = document.createElement('div');
      itemDiv.className = 'setting-item';
      const label = document.createElement('label');
      label.htmlFor = `setting-${config.key}`;

      if (config.type === 'toggle') {

        switchContainer.onclick = function(event) {

        itemDiv.appendChild(switchContainer);
      } else if (config.type === 'select') {
        const select = document.createElement('select');
        select.id = `setting-${config.key}`;
        select.name = config.key;
        config.options.forEach(opt => {
          const option = document.createElement('option');
          option.value = opt.value;
          option.textContent = opt.text;
          select.appendChild(option);
        });
        select.onclick = function(event) {
          event.stopPropagation();

        select.onmousedown = function(event) {
            event.stopPropagation();
            console.log('Select element mousedown, stopped propagation.');
        }
        itemDiv.appendChild(select);
      } else if (config.type === 'number') {
        const adjusterContainer = document.createElement('div');
        adjusterContainer.className = 'setting-number-adjuster';
        const minusButton = document.createElement('button');
        minusButton.type = 'button'; 
        minusButton.className = 'setting-adjust-button minus';
        minusButton.textContent = '−'; 
        minusButton.setAttribute('aria-label', '减少');
        const valueSpan = document.createElement('span');
        valueSpan.id = `setting-${config.key}`; 
        valueSpan.className = 'setting-number-value';
        valueSpan.textContent = config.default; 
        const plusButton = document.createElement('button');
        plusButton.type = 'button';
        plusButton.className = 'setting-adjust-button plus';
        plusButton.textContent = '+';
        plusButton.setAttribute('aria-label', '增加');
        minusButton.onclick = (event) => {
          event.stopPropagation();
          let currentValue = parseInt(valueSpan.textContent, 10);
          const step = config.step || 1;
          const min = config.min !== undefined ? config.min : -Infinity;
          if (!isNaN(currentValue)) {
            currentValue = Math.max(min, currentValue - step);
            valueSpan.textContent = currentValue;
          }
        };
        plusButton.onclick = (event) => {
          event.stopPropagation();
          let currentValue = parseInt(valueSpan.textContent, 10);
          const step = config.step || 1;
          const max = config.max !== undefined ? config.max : Infinity;
          if (!isNaN(currentValue)) {
            currentValue = Math.min(max, currentValue + step);
            valueSpan.textContent = currentValue;
          }
        };
        adjusterContainer.appendChild(minusButton);
        adjusterContainer.appendChild(valueSpan);
        adjusterContainer.appendChild(plusButton);
        itemDiv.appendChild(adjusterContainer);
      }
      return itemDiv;
    }
    function populatePanel() {
      if (!settingsPanelBody) return;
      settingsPanelBody.innerHTML = ''; 
      configOptions.forEach(config => {
        const currentValue = getConfig(config.key, config.default);
        const itemElement = createSettingItem(config);
        const inputElement = itemElement.querySelector(`#setting-${config.key}`);
        if (inputElement) {
          if (config.type === 'toggle') {
             const boolValue = currentValue === true || String(currentValue).toLowerCase() === 'true';
             inputElement.checked = boolValue;
          } else if (config.type === 'number') {
             inputElement.textContent = parseInt(currentValue, 10) || config.default;
          } else { 
            inputElement.value = currentValue;
          }
        }
        settingsPanelBody.appendChild(itemElement);
      });
    }
    function openPanel() {
      if (!settingsPanel) return;
      populatePanel(); 
      settingsPanel.classList.add('visible');

    }

      if (!settingsPanel) return;
      settingsPanel.classList.remove('visible');
      isOpen = false;

      if (isOpen) {
        closePanel();
      } else {
        openPanel();
      }

    function applySettings() {
      ThemeManager.init();

      const cardWidthPercent = getConfig('cardWidthPercent', 55);
      const cardElement = document.querySelector('.anki-card-root');
      if (cardElement) {
        const originalTransition = cardElement.style.transition;
        cardElement.style.transition = 'none';
        cardElement.classList.remove('width-percent');
        if (window.innerWidth >= 769) {
          cardElement.classList.add('width-percent');
          cardElement.style.setProperty('--card-width-percent', `${cardWidthPercent}vw`);
        } else {
          cardElement.style.removeProperty('--card-width-percent');
        }
        cardElement.offsetHeight; 
        cardElement.style.transition = originalTransition;
      }
    }
    function saveSettings() {
      if (!settingsPanelBody) return;
      configOptions.forEach(config => {
        const inputElement = settingsPanelBody.querySelector(`#setting-${config.key}`);
        if (inputElement) {
          let value;
          if (config.type === 'toggle') {
            value = inputElement.checked;
          } else if (config.type === 'number') {
            value = parseInt(inputElement.textContent, 10);
            if (isNaN(value)) value = config.default;
            if (config.min !== undefined && value < config.min) value = config.min;
            if (config.max !== undefined && value > config.max) value = config.max;
          } else { 
            value = inputElement.value;
          }
          window.ankiStorage.setConfig(config.key, value);
        }
      });
      console.log("Settings saved to localStorage.");
      applySettings();
      closePanel();
    }

            localStorage.removeItem(configPrefix + config.key);

        console.log("All settings reset to defaults (localStorage cleared).");
        populatePanel(); 
        applySettings(); 
      }

  const TimerModule = (function() {
    const showTimerConfig = getConfig('showTimer', true);
    const timerDurationConfig = parseInt(getConfig('timerDuration', 15), 10);
    const timerContainer = document.getElementById('timer-bar-container');
    const timerBar = document.getElementById('timer-bar');
    const timerTextElement = document.getElementById('timer-text');
    let timerInterval;
    let remainingTimeInSeconds;
    function updateDisplay(currentTime, totalTime) {
      if (!timerBar || !timerTextElement || !timerContainer) return;
      const percentage = (currentTime / totalTime) * 100;
      timerBar.style.width = percentage + '%';
      if (currentTime > 0) {
        timerTextElement.textContent = `${Math.ceil(currentTime)}s`;
        timerTextElement.style.fontWeight = '500';
        timerTextElement.style.color = 'var(--text-secondary)';
      } else {
        timerTextElement.textContent = "Time's Up!";
        timerTextElement.style.fontWeight = 'bold';
      }
      if (currentTime <= 0) {
        timerBar.style.backgroundColor = 'var(--color-danger)';
        timerContainer.classList.add('timer-expired');
        timerTextElement.style.color = 'var(--color-danger)';
      } else if (percentage <= 35) {
        timerBar.style.backgroundColor = 'var(--color-danger)';
      } else if (percentage <= 70) {
        timerBar.style.backgroundColor = 'var(--color-warning)';
      } else {
        timerBar.style.backgroundColor = 'var(--color-primary)';
      }
    }
    function start(duration) {
      if (!timerContainer || !timerBar) return;
      timerContainer.style.display = 'flex';
      remainingTimeInSeconds = duration;
      updateDisplay(remainingTimeInSeconds, duration);
      timerInterval = setInterval(() => {
        remainingTimeInSeconds -= 0.1;
        if (remainingTimeInSeconds < 0) remainingTimeInSeconds = 0;
        updateDisplay(remainingTimeInSeconds, duration);

          optionsContainer.style.top = clampedTop + 'px';
          optionsContainer.style.right = 'auto';
          optionsContainer.style.transform = 'none';
        }
      });
      document.addEventListener('mouseup', function() {
        if (isDragging) {
          isDragging = false;
          optionsContainer.classList.remove('dragging');
          const left = parseInt(optionsContainer.style.left) || 0;
          const top = parseInt(optionsContainer.style.top) || 0;
          window.ankiStorage.setConfig('optionsPosition', { left, top });
        }
      });
      optionsContainer.addEventListener('touchstart', function(e) {
        const rect = optionsContainer.getBoundingClientRect();
        const touch = e.touches[0];
        const clickY = touch.clientY - rect.top;
        if (clickY <= 40) {
          isDragging = true;
          startX = touch.clientX;
          startY = touch.clientY;
          startLeft = parseInt(optionsContainer.style.left) || 0;
          startTop = parseInt(optionsContainer.style.top) || 0;
          optionsContainer.classList.add('dragging');
          e.preventDefault();
        }
      });
      document.addEventListener('touchmove', function(e) {
        if (isDragging) {
          const touch = e.touches[0];
          const deltaX = touch.clientX - startX;
          const deltaY = touch.clientY - startY;
          const newLeft = startLeft + deltaX;
          const newTop = startTop + deltaY;
          const maxLeft = window.innerWidth - optionsContainer.offsetWidth - 20;
          const maxTop = window.innerHeight - optionsContainer.offsetHeight - 20;
          const minLeft = 20;
          const minTop = 20;
          const clampedLeft = Math.max(minLeft, Math.min(newLeft, maxLeft));
          const clampedTop = Math.max(minTop, Math.min(newTop, maxTop));
          optionsContainer.style.left = clampedLeft + 'px';
          optionsContainer.style.top = clampedTop + 'px';
          optionsContainer.style.right = 'auto';
          optionsContainer.style.transform = 'none';
          e.preventDefault();
        }
      });
      document.addEventListener('touchend', function() {
        if (isDragging) {
          isDragging = false;
          optionsContainer.classList.remove('dragging');
          const left = parseInt(optionsContainer.style.left) || 0;
          const top = parseInt(optionsContainer.style.top) || 0;
          window.ankiStorage.setConfig('optionsPosition', { left, top });
        }
      });
      const savedHidden = window.ankiStorage.getConfig('optionsHidden');
      if (savedHidden) {
        optionsContainer.style.display = 'none';
      }
      function ensureFloatingWindowInViewport() {
        if (!optionsContainer || optionsContainer.style.display === 'none') return;
        const rect = optionsContainer.getBoundingClientRect();
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        let needsUpdate = false;
        let newLeft = parseInt(optionsContainer.style.left) || 0;
        let newTop = parseInt(optionsContainer.style.top) || 0;
        const minWidth = window.innerWidth <= 480 ? 260 : 280;
        const containerWidth = Math.max(rect.width, minWidth);
        if (rect.right > viewportWidth - 20) {
          newLeft = viewportWidth - containerWidth - 20;
          needsUpdate = true;
        }
        if (rect.left < 20) {
          newLeft = 20;
          needsUpdate = true;
        }
        if (rect.bottom > viewportHeight - 20) {
          newTop = viewportHeight - rect.height - 20;
          needsUpdate = true;
        }
        if (rect.top < 20) {
          newTop = 20;
          needsUpdate = true;
        }
        if (needsUpdate) {
          optionsContainer.style.left = newLeft + 'px';
          optionsContainer.style.top = newTop + 'px';
          optionsContainer.style.right = 'auto';
          optionsContainer.style.transform = 'none';
          window.ankiStorage.setConfig('optionsPosition', { left: newLeft, top: newTop });
        }
      }
      let resizeTimeout;
      function handleResize() {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          ensureFloatingWindowInViewport();
          const cardWidthPercent = getConfig('cardWidthPercent', 55);
          const cardElement = document.querySelector('.anki-card-root');
          if (cardElement) {
            const originalTransition = cardElement.style.transition;
            cardElement.style.transition = 'none';
            cardElement.classList.remove('width-percent');
            if (window.innerWidth >= 769) {
              cardElement.classList.add('width-percent');
              cardElement.style.setProperty('--card-width-percent', `${cardWidthPercent}vw`);
            } else {
              cardElement.style.removeProperty('--card-width-percent');
            }
            cardElement.offsetHeight; 
            cardElement.style.transition = originalTransition;
          }
        }, 100);
      }
      window.addEventListener('resize', handleResize);
      ensureFloatingWindowInViewport();
    }
    function initLayout() {
      if (!isChoiceQuestion()) {
        if (layoutToggleButton) {
          layoutToggleButton.style.display = 'none';
        }
        return;
      }
      if (layoutToggleButton) {
        layoutToggleButton.style.display = 'flex';
        const savedLayout = window.ankiStorage.getConfig('layoutMode', 'vertical');
        if (savedLayout === 'floating') {
          cardElement.classList.add('layout-floating');
          layoutToggleButton.textContent = '📋';
          layoutToggleButton.title = '切换到浮动窗口';
          initFloatingWindowInteraction();
        } else {
          cardElement.classList.remove('layout-floating');
          layoutToggleButton.textContent = '🔲';
          layoutToggleButton.title = '切换到上下布局';
        }
        const toggleHandler = function(event) {
          event.preventDefault();
          event.stopPropagation();
          toggleLayout();
        };
        layoutToggleButton.addEventListener('click', toggleHandler);
        layoutToggleButton.addEventListener('touchend', toggleHandler);
        layoutToggleButton.style.webkitTouchCallout = 'none';
        layoutToggleButton.style.webkitUserSelect = 'none';
        layoutToggleButton.style.userSelect = 'none';
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        initLayout();
        const cardWidthPercent = getConfig('cardWidthPercent', 55);
        const cardElement = document.querySelector('.anki-card-root');
        if (cardElement) {
          const originalTransition = cardElement.style.transition;
          cardElement.style.transition = 'none';
          cardElement.classList.remove('width-percent');
          if (window.innerWidth >= 769) {
            cardElement.classList.add('width-percent');
            cardElement.style.setProperty('--card-width-percent', `${cardWidthPercent}vw`);
          } else {
            cardElement.style.removeProperty('--card-width-percent');
          }
          cardElement.offsetHeight; 
          cardElement.style.transition = originalTransition;
        }
      });
    } else {
      initLayout();
      const cardWidthPercent = getConfig('cardWidthPercent', 55);
      const cardElement = document.querySelector('.anki-card-root');
      if (cardElement) {
        const originalTransition = cardElement.style.transition;
        cardElement.style.transition = 'none';
        cardElement.classList.remove('width-percent');
        if (window.innerWidth >= 769) {
          cardElement.classList.add('width-percent');
          cardElement.style.setProperty('--card-width-percent', `${cardWidthPercent}vw`);
        } else {
          cardElement.style.removeProperty('--card-width-percent');
        }
        cardElement.offsetHeight; 
        cardElement.style.transition = originalTransition;
      }
    }
  })();
})();
</script>
